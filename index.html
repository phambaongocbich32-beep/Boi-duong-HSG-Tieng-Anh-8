<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi HSG Tiếng Anh 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a single reading column with a sticky tab bar; exercise blocks as ruled "worksheet" cards, ink-blue accent, marker-yellow highlight. */
:root{
  --bg:#f2f4f9;--card:#ffffff;--ink:#16213e;--sub:#56637f;--line:#d7deec;
  --acc:#2447c9;--accbg:#e4ebff;--hl:#ffe98f;--ok:#16794f;--okbg:#e2f5ec;--bad:#bf3a2d;--badbg:#fde9e6;--warnbg:#fff4d6;
  --font:"Be Vietnam Pro","Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1629;--card:#172038;--ink:#e6ecff;--sub:#a2afd0;--line:#29365a;
  --acc:#8fb0ff;--accbg:#223562;--hl:#5a4d18;--ok:#6fd6a0;--okbg:#14352a;--bad:#ff8f84;--badbg:#401f1c;--warnbg:#3b3416;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1629;--card:#172038;--ink:#e6ecff;--sub:#a2afd0;--line:#29365a;
  --acc:#8fb0ff;--accbg:#223562;--hl:#5a4d18;--ok:#6fd6a0;--okbg:#14352a;--bad:#ff8f84;--badbg:#401f1c;--warnbg:#3b3416;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;font-size:16px}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800;margin-bottom:10px}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 10px}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--acc)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-size:1.1rem;font-weight:800;letter-spacing:.2px}
.brand span{font-size:.85rem;color:var(--sub)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--sub);padding:10px 14px;min-height:44px;font-weight:600;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--acc);border-bottom-color:var(--acc);background:var(--accbg)}
.tab .n{margin-left:6px;background:var(--bad);color:#fff;border-radius:10px;font-size:.75rem;padding:0 7px;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:18px 16px 80px}
.sub{color:var(--sub);font-size:.95rem}
.sec{margin:0 0 26px;display:flex;flex-direction:column;gap:14px}
.lead{max-width:68ch}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.hl{border-left:5px solid var(--acc)}
.warn{background:var(--warnbg);border-radius:8px;padding:8px 12px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile:hover{border-color:var(--acc)}
.tile b{font-size:1.02rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}
.stat{font-size:.85rem;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:600}
.btn:hover{background:var(--accbg)}
.btn.pri{background:var(--acc);color:var(--bg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.92rem}
.btn[aria-pressed="true"]{background:var(--acc);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;min-height:38px;font-size:.9rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}

/* theory */
details.th{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0}
details.th>summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:44px;align-items:center}
details.th>summary::after{content:"+";font-size:1.3rem;color:var(--acc);font-weight:400}
details.th[open]>summary::after{content:"–"}
details.th>summary::-webkit-details-marker{display:none}
details.th .body{padding:0 16px 14px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--accbg);font-weight:700}
.body ul,.body ol,.card ul,.card ol{margin:6px 0;padding-left:22px}
.body li,.card li{margin:4px 0}
.body table{margin:8px 0}

/* exercise set */
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.set-h{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--accbg)}
.set-h h3{margin:0}
.score{font-weight:700;font-size:.9rem;color:var(--sub);font-variant-numeric:tabular-nums}
.score.done{color:var(--ok)}
.set-i{padding:10px 16px 0;color:var(--sub);font-size:.93rem}
.qs{padding:6px 16px 14px;display:flex;flex-direction:column}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q .p{display:flex;gap:10px}
.q .no{flex:0 0 auto;color:var(--sub);font-weight:700;min-width:1.7em;font-variant-numeric:tabular-nums}
.q .t{flex:1;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 2.4em}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;min-height:44px;text-align:left;display:inline-flex;gap:8px;align-items:center}
.opt:hover{border-color:var(--acc)}
.opt .l{font-weight:800;color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.fi{font:inherit;border:0;border-bottom:2px solid var(--acc);background:var(--accbg);color:var(--ink);padding:2px 6px;border-radius:4px 4px 0 0;min-width:6ch;max-width:100%}
.fi.ok{border-bottom-color:var(--ok);background:var(--okbg)}
.fi.bad{border-bottom-color:var(--bad);background:var(--badbg)}
.fline{margin:8px 0 0 2.4em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fline .fi{min-width:14ch}
.hint{color:var(--sub);font-size:.9rem}
.fb{margin:8px 0 0 2.4em;padding:8px 12px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ink);border-left:4px solid var(--ok)}
.fb.bad{background:var(--badbg);color:var(--ink);border-left:4px solid var(--bad)}
.fb b.k{color:var(--ok)}
.fb.bad b.k{color:var(--bad)}
.set-f{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}

/* sort rows */
.srow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow .w{font-size:1.08rem;font-weight:600;min-width:9ch}
.srow .opts{margin:0}
.srow .note{flex-basis:100%;font-size:.9rem;color:var(--sub)}
.srow .opt{min-height:40px;padding:5px 12px}

/* cloze */
.cloze{padding:12px 16px 4px;line-height:2.3}
.cloze .fi{min-width:12ch;text-align:center}
.cloze sup{color:var(--sub);font-weight:700;margin-right:2px}

/* word-form units */
.units{display:flex;gap:6px;flex-wrap:wrap}
.uh td{background:var(--accbg);font-weight:800}
.cov{background:var(--line);color:transparent;border-radius:4px;cursor:pointer;user-select:none;padding:0 6px}
.cov.show{background:var(--hl);color:var(--ink)}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tool input[type=search]{font:inherit;padding:8px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);flex:1 1 180px}

/* writing */
.para{font-size:1.05rem;max-width:70ch}
.k{font:inherit;display:inline;min-height:0;padding:0 3px;border:0;border-bottom:2px solid var(--acc);border-radius:3px;background:var(--accbg);color:var(--ink);font-weight:600;cursor:pointer}
.k.on{background:var(--hl)}
.hide .k:not(.shown){color:transparent;background:var(--line);border-bottom-color:var(--sub);user-select:none}
.info{min-height:78px;border-left:4px solid var(--acc);padding:8px 12px;background:var(--accbg);border-radius:6px}
.sn{display:block;margin:3px 0;padding:3px 8px;border-radius:6px;border-left:4px solid transparent}
.sn small{color:var(--sub);font-weight:700;margin-right:6px}
.sn.topic{background:var(--accbg);border-left-color:var(--acc)}
.sn.main{background:var(--hl);border-left-color:var(--ink)}
.sn.detail{background:var(--bg);border-left-color:var(--line)}
.sn.concl{background:var(--okbg);border-left-color:var(--ok)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem}
.legend span{padding:2px 10px;border-radius:12px}
textarea{width:100%;min-height:210px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
select,input[type=number]{font:inherit;padding:8px 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=number]{width:90px}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.auto li{list-style:none;margin-left:-20px}
.chk label{cursor:pointer;display:flex;gap:8px;align-items:flex-start;padding:4px 0;min-height:36px}
.chk input{width:20px;height:20px;margin-top:5px;accent-color:var(--acc)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--sub)}
.big{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}

/* exam */
.exam-bar{position:sticky;top:98px;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.exam-sec{font-weight:800;color:var(--acc);margin:14px 0 0;font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
.hist li{font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--sub)}

@media (max-width:520px){
  h1{font-size:1.4rem}
  .opts,.fb,.fline{margin-left:0}
  .exam-bar{top:92px}
  main{padding-top:14px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.srow .fb{margin:0;flex-basis:100%}
.srow .fbx{flex-basis:100%}

</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand"><b>HSG Tiếng Anh 8</b><span>Phát âm · Word form · Ngữ pháp · Viết đoạn</span></div><nav class="tabs" id="tabs" aria-label="Các phần"></nav></div></header>
<main id="app"></main>
<script>
/* ===== Helpers ===== */
const mc=(q,o,a,e)=>({k:'mc',q,o,a,e:e||''});
const fl=(q,a,e,h)=>({k:'fill',q,a:[].concat(a),e:e||'',h:h||''});
const fx=(q,a,e)=>({k:'fix',q,a:[].concat(a),e:e||''});
const od=(opts,a,e)=>mc('Chọn từ có phần gạch chân phát âm khác các từ còn lại.',opts,a,e);
const ABC3=['a','an','the'];

/* ===== SETS: each set = one exercise block ===== */
const SETS=[];
const add=s=>SETS.push(s);

/* ---------- PHÁT ÂM ---------- */
add({id:'pa1',sec:'pa',title:'Bài 1. Phân loại /uː/ và /ʊ/',instr:'Chạm vào âm đúng cho phần gạch chân.',type:'sort',cats:['/uː/','/ʊ/'],
items:[['f<u>oo</u>d',0,'/fuːd/'],['w<u>oo</u>d',1,'/wʊd/'],['gr<u>ou</u>p',0,'/gruːp/'],['c<u>ou</u>ld',1,'/kʊd/'],['j<u>ui</u>ce',0,'/dʒuːs/'],['b<u>oo</u>k',1,'/bʊk/'],['t<u>oo</u>th',0,'/tuːθ/'],['w<u>o</u>lf',1,'/wʊlf/'],['t<u>oo</u>l',0,'/tuːl/'],['sh<u>ou</u>ld',1,'/ʃʊd/'],['rem<u>o</u>ve',0,'/rɪˈmuːv/'],['w<u>o</u>man',1,'/ˈwʊmən/'],['cr<u>ui</u>se',0,'/kruːz/'],['g<u>oo</u>d',1,'/gʊd/']]});

add({id:'pa2',sec:'pa',title:'Bài 2. Tìm từ có phần gạch chân phát âm khác (/uː/, /ʊ/)',instr:'Chọn đáp án đúng.',type:'list',qs:[
od(['f<u>oo</u>d','f<u>oo</u>t','h<u>oo</u>k','w<u>oo</u>d'],0,'food /fuːd/; foot /fʊt/, hook /hʊk/, wood /wʊd/ đều là /ʊ/.'),
od(['gr<u>ou</u>p','sh<u>ou</u>ld','w<u>ou</u>ld','c<u>ou</u>ld'],0,'group /gruːp/ là /uː/; should, would, could là /ʊ/.'),
od(['fr<u>ui</u>t','s<u>ui</u>t','j<u>ui</u>ce','b<u>ui</u>ld'],3,'fruit, suit, juice là /uː/; build /bɪld/ là /ɪ/.'),
od(['l<u>o</u>se','impr<u>o</u>ve','m<u>o</u>vie','d<u>o</u>ve'],3,'lose /luːz/, improve /ɪmˈpruːv/, movie /ˈmuːvi/ là /uː/; dove /dʌv/ là /ʌ/.'),
od(['p<u>u</u>ll','l<u>u</u>nar','f<u>u</u>ll','p<u>u</u>t'],1,'pull, full, put là /ʊ/; lunar /ˈluːnə/ là /uː/.'),
od(['f<u>oo</u>t','b<u>oo</u>ts','l<u>oo</u>k','b<u>oo</u>k'],1,'foot, look, book là /ʊ/; boots /buːts/ là /uː/.'),
od(['p<u>oo</u>l','c<u>oo</u>k','st<u>oo</u>d','w<u>oo</u>l'],0,'pool /puːl/ là /uː/; cook, stood, wool là /ʊ/.'),
od(['f<u>oo</u>t','f<u>oo</u>d','c<u>oo</u>l','r<u>oo</u>t'],0,'foot /fʊt/ là /ʊ/; food, cool, root là /uː/.'),
od(['r<u>u</u>de','p<u>u</u>ll','r<u>u</u>le','incl<u>u</u>de'],1,'pull /pʊl/ là /ʊ/; rude, rule, include là /uː/.'),
od(['p<u>u</u>sh','g<u>oo</u>d','m<u>o</u>ve','c<u>ou</u>ld'],2,'move /muːv/ là /uː/; push, good, could là /ʊ/.'),
od(['gr<u>ou</u>p','thr<u>ew</u>','gl<u>ue</u>','w<u>oo</u>d'],3,'wood /wʊd/ là /ʊ/; group, threw /θruː/, glue /gluː/ là /uː/.'),
od(['w<u>oo</u>dland','p<u>u</u>shy','s<u>oo</u>n','b<u>u</u>sh'],2,'soon /suːn/ là /uː/; woodland /ˈwʊdlənd/, pushy /ˈpʊʃi/, bush /bʊʃ/ là /ʊ/.'),
od(['c<u>ou</u>ld','can<u>oe</u>','sh<u>oe</u>','t<u>o</u>mb'],0,'could /kʊd/ là /ʊ/; canoe /kəˈnuː/, shoe /ʃuː/, tomb /tuːm/ là /uː/.'),
od(['s<u>u</u>gar','bl<u>ue</u>','fl<u>u</u>','j<u>u</u>ne'],0,'sugar /ˈʃʊgə/ là /ʊ/; blue, flu, June là /uː/.'),
od(['h<u>oo</u>d','t<u>oo</u>k','sm<u>oo</u>th','w<u>oo</u>l'],2,'smooth /smuːð/ là /uː/; hood, took, wool là /ʊ/.')
]});

add({id:'pa3',sec:'pa',title:'Bài 3. Phân loại /ə/ và /ɪ/',instr:'Chạm vào âm đúng cho phần gạch chân.',type:'sort',cats:['/ə/','/ɪ/'],
items:[['b<u>a</u>nana',0,'/bəˈnænə/'],['vill<u>a</u>ge',1,'/ˈvɪlɪdʒ/ (âm cuối -age đọc /ɪdʒ/)'],['answ<u>e</u>r',0,'/ˈænsə/'],['b<u>e</u>come',1,'/bɪˈkʌm/ (tiền tố be-)'],['<u>a</u>tom',0,'/ˈætəm/'],['w<u>i</u>n',1,'/wɪn/'],['pict<u>u</u>re',0,'/ˈpɪktʃə/'],['b<u>ui</u>ld',1,'/bɪld/'],['fam<u>ou</u>s',0,'/ˈfeɪməs/'],['b<u>e</u>have',1,'/bɪˈheɪv/'],['sil<u>e</u>nt',0,'/ˈsaɪlənt/'],['cott<u>a</u>ge',1,'/ˈkɒtɪdʒ/'],['c<u>o</u>mpare',0,'/kəmˈpeə/'],['m<u>i</u>ss',1,'/mɪs/'],['s<u>u</u>ggest',0,'/səˈdʒest/'],['g<u>ui</u>lt',1,'/gɪlt/']]});

add({id:'pa4',sec:'pa',title:'Bài 4. Tìm từ có phần gạch chân phát âm khác',instr:'Chọn đáp án đúng.',type:'list',qs:[
od(['n<u>o</u>rmal','visit<u>o</u>rs','transp<u>o</u>rt','ch<u>o</u>re'],1,'normal /ˈnɔːml/, transport /ˈtrænspɔːt/, chore /tʃɔː/ có /ɔː/; visitors /ˈvɪzɪtəz/ có /ə/.'),
od(['b<u>a</u>sic','m<u>a</u>jor','cr<u>a</u>ft','r<u>a</u>cing'],2,'basic /ˈbeɪsɪk/, major /ˈmeɪdʒə/, racing /ˈreɪsɪŋ/ có /eɪ/; craft /krɑːft/ có /ɑː/.'),
od(['<u>c</u>eremony','<u>c</u>ultural','<u>c</u>attle','<u>c</u>ostume'],0,'ceremony /ˈserəməni/: c đọc /s/. Ba từ còn lại c đọc /k/. (c đứng trước e, i, y thì đọc /s/.)'),
od(['c<u>ou</u>ntry','cl<u>ou</u>d','l<u>ou</u>dly','m<u>ou</u>se'],0,'country /ˈkʌntri/: ou đọc /ʌ/. cloud, loudly, mouse: ou đọc /aʊ/.'),
od(['c<u>a</u>mel','c<u>a</u>ttle','p<u>a</u>ddy','buff<u>a</u>lo'],3,'camel, cattle, paddy: a đọc /æ/. buffalo /ˈbʌfələʊ/: a đọc /ə/.'),
od(['entert<u>ai</u>n','r<u>ai</u>n','<u>ai</u>r','str<u>ai</u>n'],2,'entertain, rain, strain: ai đọc /eɪ/. air /eə/.'),

function markMC(box,q,i){

}

function inExam(el){return !!el.closest('#examBody')}
function answerMC(box,i){
  const key=box.dataset.key,q=QI[key];
  if(inExam(box)){EX.ans[key]=i;$$('.opt',box).forEach((b,j)=>b.classList.toggle('sel',j===i));examCount();return}
  const ok=i===q.a;record(key,ok,i);markMC(box,q,i);showFB(box,q,ok,i);updScore(q.set);
}
function checkFill(box,inp){
  const key=box.dataset.key,q=QI[key];inp=inp||$('input.fi',box);
  const v=inp.value;if(!v.trim()){inp.focus();return false}
  const ok=gradeText(q,v);record(key,ok,v);
  inp.disabled=true;inp.classList.add(ok?'ok':'bad');
  const b=$('.chk',box);if(b)b.remove();
  showFB(box,q,ok,v);updScore(q.set);return true;
}
function refreshSet(id){const s=SETS.find(x=>x.id===id),el=$('#set-'+id);if(s&&el){el.outerHTML=setHTML(s)}}

document.addEventListener('click',e=>{
  const t=e.target;
  let b;
  if((b=t.closest('.opt'))&&!b.disabled){const box=b.closest('[data-key]');if(box)answerMC(box,+b.dataset.i);return}
  if((b=t.closest('.chk'))){checkFill(b.closest('[data-key]'));return}
  if((b=t.closest('.chkall'))){
    const s=SETS.find(x=>x.id===b.dataset.set);let any=false;
    $$('.cloze input.fi',$('#set-'+s.id)).forEach(inp=>{
      if(inp.disabled||!inp.value.trim())return;any=true;
      const key=inp.dataset.key,q=QI[key],ok=gradeText(q,inp.value);record(key,ok,inp.value);
      inp.disabled=true;inp.classList.add(ok?'ok':'bad');
    });
    if(any){const cf=$('#cf-'+s.id);let fb='';s.blanks.forEach((bl,i)=>{const st=ST.res[s.id+'.'+i];if(st&&!st.ok)fb+='<div class="fb bad" style="margin:6px 0 0"><b class="k">('+(i+1)+')</b> Đáp án: <b>'+esc(bl[1][0])+'</b>. '+bl[2]+'</div>'});
      cf.innerHTML=fb||'<div class="fb ok" style="margin:6px 0 0"><b class="k">Đúng hết.</b></div>';updScore(s.id)}
    return;
  }
  if((b=t.closest('.reset'))){
    const s=SETS.find(x=>x.id===b.dataset.set);keysOf(s).forEach(k=>delete ST.res[k]);save();updateBadge();refreshSet(s.id);return;
  }
  if((b=t.closest('[data-togg]'))){
    const open=b.dataset.togg==='1';$$('details.th').forEach(d=>d.open=open);return;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('input.fi')){

    if(box&&!inExam(box)&&!e.target.closest('.cloze'))checkFill(box,e.target);

});
document.addEventListener('input',e=>{

});

  const m2B=$('#m2B');
  m2B.onclick=()=>{const on=m2B.getAttribute('aria-pressed')!=='true';m2B.setAttribute('aria-pressed',on);$('#m2').style.display=on?'none':'';m2B.textContent=on?'Hiện đoạn mẫu':'Ẩn đoạn (tự viết trước)'};
  /* tự viết */
  const ta=$('#ta'),topic=$('#topic');
  const load_=()=>{ta.value=(ST.draft&&ST.draft[topic.value])||'';upd()};
  function upd(){
    const t=ta.value,n=wc(t);$('#cnt').textContent=n;
    const st=$('#st');
    if(!n){st.textContent='';st.className=''}
    else if(n<120){st.textContent='(cần thêm '+(120-n)+' từ)';st.className='bad-t'}
    else if(n<=150){st.textContent='(đạt 120–150 ✓)';st.className='ok-t'}
    else{st.textContent='(thừa '+(n-150)+' từ, cần cắt)';st.className='bad-t'}
    const sents=t.split(/[.!?]+(?:\s|$)/).filter(x=>x.trim()).length;$('#sc').textContent=sents;
    const has=r=>r.test(t);
    const items=[
      [n>=120&&n<=150,'Độ dài 120–150 từ'],
      [!/\n/.test(t.trim())&&n>0,'Viết liền một khối, không xuống dòng'],
      [sents>=10&&sents<=14,'Khoảng 12 câu (10–14 câu)'],
      [has(/\b(firstly|first of all)\b/i)&&has(/\bsecondly\b/i)&&has(/\b(thirdly|finally)\b/i),'Có Firstly, Secondly, Thirdly/Finally'],
      [(t.match(/for example|for instance|such as/gi)||[]).length>=2,'Có ít nhất 2 ví dụ (For example, For instance)'],
      [has(/in conclusion|to sum up|in short|therefore/i),'Có câu kết (In conclusion, To sum up...)'],
      [!/very wonderful|funny activities|\bin here\b/i.test(t)&&n>0,'Không dùng very wonderful, funny activities, in here']
    ];
    $('#auto').innerHTML=items.map(i=>'<li>'+(i[0]?'<span class="ok-t">✓</span>':'<span class="bad-t">○</span>')+' '+i[1]+'</li>').join('');
  }
  ta.addEventListener('input',()=>{ST.draft=ST.draft||{};ST.draft[topic.value]=ta.value;save();upd()});
  topic.addEventListener('change',()=>{$('#topicNote').textContent=WR_TOPICS[topic.value][1];load_()});
  load_();
  /* checklist */
  const box=$('#chk');
  CHK.forEach((t,i)=>{
    const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!(ST.chk&&ST.chk[i]);
    c.onchange=()=>{ST.chk=ST.chk||{};ST.chk[i]=c.checked;save();prog()};
    l.appendChild(c);const s=document.createElement('span');s.textContent=t;l.appendChild(s);box.appendChild(l);
  });
  function prog(){$('#prog').textContent='Đã soát '+$$('input:checked',box).length+' / '+CHK.length+' mục'}
  prog();
  /* máy tính điểm */
  const ids=['c1','c2','c3','c4','c5','c6','c7'];
  const calc=()=>{
    const v=ids.map(i=>parseFloat($('#'+i).value)||0);
    const raw=Math.min(3,v[0])+Math.min(4,v[1])+Math.min(2,v[2])+Math.min(1,v[3])-v[4]*1-v[5]*0.5-v[6]*2;
    $('#calcOut').textContent=Math.max(0,Math.round(raw*10)/10).toString().replace('.',',');
  };
  ids.forEach(i=>$('#'+i).addEventListener('input',calc));calc();
}

/* ----- Đề thi thử ----- */
let EX=null,TM=null;
const PLANS={20:[['pa',3],['wf',5],['cd1',2],['cd2',2],['cd3',2],['cd4',2],['cd5',2],['cd6',2]],40:[['pa',6],['wf',10],['cd1',4],['cd2',4],['cd3',4],['cd4',4],['cd5',4],['cd6',4]]};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(n){
  if(n==='p2'){const ks=EXAM2.map((_,i)=>'e2.'+i);EX={keys:ks,ans:{},start:Date.now(),end:Date.now()+45*60000,mins:45,done:false,n:ks.length,paper:'p2'};runTimer();return}
  n=+n;const keys=[];
  PLANS[n].forEach(([sec,m])=>{
    const pool=Object.keys(QI).filter(k=>QI[k].sec===sec&&QI[k].src==='list'&&(QI[k].k==='mc'||QI[k].k==='fill'));
    keys.push(...shuffle(pool).slice(0,m));
  });
  const mins=n===20?25:50;
  EX={keys,ans:{},start:Date.now(),end:Date.now()+mins*60000,mins,done:false,n:keys.length};
  runTimer();
}
function runTimer(){
  clearInterval(TM);
  TM=setInterval(()=>{
    if(!EX||EX.done){clearInterval(TM);return}
    const left=Math.max(0,EX.end-Date.now()),el=$('#tm');
    if(el){el.textContent=fmt(left);el.classList.toggle('low',left<5*60000)}
    if(left<=0)submitExam();
  },1000);
}
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function examCount(){const el=$('#exCount');if(!el)return;const n=EX.keys.filter(k=>EX.ans[k]!==undefined&&String(EX.ans[k]).trim()!=='').length;el.textContent='Đã trả lời '+n+'/'+EX.n}
function submitExam(){
  if(!EX||EX.done)return;
  EX.done=true;EX.res={};let c=0;const by={};
  EX.keys.forEach(k=>{
    const q=QI[k],v=EX.ans[k];
    const ok=v!==undefined&&(q.k==='mc'?v===q.a:gradeText(q,v));
    EX.res[k]=ok;if(ok)c++;
    const b=by[q.sec]=by[q.sec]||[0,0];b[1]++;if(ok)b[0]++;
    ST.res[k]={ok,v};
  });
  EX.c=c;EX.score=Math.round(c/EX.n*100)/10;
  ST.exam=(ST.exam||[]);ST.exam.push({p:EX.paper||'',t:Date.now(),n:EX.n,c,s:EX.score,used:Math.round((Math.min(Date.now(),EX.end)-EX.start)/60000)});
  save();updateBadge();EX.by=by;
  if(location.hash.indexOf('#test')===0)route();
}
function viewTest(){
  if(!EX){
    const hist=(ST.exam||[]).slice(-6).reverse();
    return '<div class="sec"><div><h1>Đề thi thử</h1><p class="sub lead">Câu hỏi được rút ngẫu nhiên từ tất cả phần (phát âm, hình thức từ, 6 chuyên đề), mỗi lần một đề khác. Không hiện đáp án cho đến khi nộp bài.</p></div>'+
    '<div class="grid"><div class="card hl"><b>Đề số 2: Chuyên đề 1–5 (cố định)</b><p class="stat">40 câu mới, 8 câu mỗi chuyên đề (danh từ, mạo từ, đại từ, V-ing/to V, giới từ). 45 phút, mọi người làm cùng một đề.</p><button class="btn pri" data-start="p2">Bắt đầu Đề số 2</button></div><div class="card"><b>Đề ngắn: 20 câu</b><p class="stat">25 phút. Dùng khi còn ít thời gian.</p><button class="btn pri" data-start="20">Bắt đầu đề 20 câu</button></div><div class="card"><b>Đề đầy đủ: 40 câu</b><p class="stat">50 phút. Mô phỏng một bài thi hoàn chỉnh.</p><button class="btn pri" data-start="40">Bắt đầu đề 40 câu</button></div></div>'+
    (hist.length?'<h2>Các lần làm gần đây</h2><div class="card"><ul class="hist">'+hist.map(h=>'<li>'+new Date(h.t).toLocaleString('vi-VN')+(h.p==='p2'?' (Đề số 2)':'')+': <b>'+String(h.s).replace('.',',')+'/10</b> ('+h.c+'/'+h.n+' câu, '+h.used+' phút)</li>').join('')+'</ul></div>':'')+'</div>';
  }
  if(!EX.done){
    let h='<div class="sec"><div class="exam-bar"><div><span class="stat">Thời gian còn lại</span><div class="timer" id="tm">'+fmt(Math.max(0,EX.end-Date.now()))+'</div></div><span id="exCount" class="stat"></span><div class="row"><button class="btn sm" id="exCancel">Hủy đề</button><button class="btn pri" id="exSubmit">Nộp bài</button></div></div><div id="examBody" class="set"><div class="qs">';
    let last='',no=0;
    EX.keys.forEach(k=>{const q=QI[k];if(q.sec!==last){last=q.sec;h+='<div class="exam-sec">'+SECS[q.sec]+'</div>'}h+=qHTML(k,++no,{mode:'exam',v:EX.ans[k]})});
    return h+'</div></div></div>';
  }
  let h='<div class="sec"><div class="card hl"><div class="stat">Kết quả</div><div class="big">'+String(EX.score).replace('.',',')+' / 10</div><p>Đúng '+EX.c+'/'+EX.n+' câu. Các câu sai đã được thêm vào Sổ lỗi sai.</p></div>';
  h+='<div class="card tbl"><table><tr><th>Phần</th><th>Đúng</th><th>Tổng</th></tr>'+Object.keys(EX.by).map(s=>'<tr><td>'+SECS[s]+'</td><td>'+EX.by[s][0]+'</td><td>'+EX.by[s][1]+'</td></tr>').join('')+'</table></div>';
  h+='<div class="row"><button class="btn pri" data-start="'+(EX.paper||(EX.n>=40?40:20))+'">'+(EX.paper?'Làm lại đề này':'Làm đề mới')+'</button><button class="btn" id="exBack">Về màn hình chọn đề</button><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="#wrong">Luyện lại câu sai</a></div><h2>Xem lại bài</h2><div class="set"><div class="qs">';
  let no=0;EX.keys.forEach(k=>{no++;h+=qHTML(k,no,{mode:'review',st:{ok:EX.res[k],v:EX.ans[k]}})});
  return h+'</div></div></div>';
}

/* ----- Sổ lỗi sai ----- */
function viewWrong(){
  const keys=Object.keys(ST.res).filter(k=>ST.res[k].ok===false&&QI[k]);
  keys.sort((a,b)=>SEC_ORDER.indexOf(QI[a].sec)-SEC_ORDER.indexOf(QI[b].sec));
  let h='<div class="sec"><div><h1>Sổ lỗi sai</h1><p class="sub lead">Mọi câu bạn làm sai ở các phần đều được gom ở đây. Làm đúng lại thì câu đó biến mất khỏi sổ.</p></div>';
  if(!keys.length)return h+'<div class="card empty">Chưa có câu sai nào. Hãy làm bài ở các phần hoặc thi thử.</div></div>';
  h+='<div class="row"><b>'+keys.length+' câu cần luyện lại</b></div><div class="set"><div class="qs" id="wrongList">';
  let last='',no=0;
  keys.forEach(k=>{const q=QI[k];if(q.sec!==last){last=q.sec;h+='<div class="exam-sec">'+(CDNAME[q.sec]||SECS[q.sec])+'</div>'}h+=qHTML(k,++no,{fresh:true})});
  return h+'</div></div></div>';
}

/* ===================== Bộ định tuyến ===================== */
const TABS=[['home','Trang chủ'],['pa','Phát âm'],['wf','Hình thức từ'],['gr','Ngữ pháp'],['wr','Viết đoạn'],['test','Đề thi thử'],['wrong','Sổ lỗi sai']];
function route(){
  const hash=(location.hash||'#home').slice(1);
  const parts=hash.split('-'),tab=TABS.some(t=>t[0]===parts[0])?parts[0]:'home',sub=parts.slice(1).join('-');
  $('#tabs').innerHTML=TABS.map(t=>'<a class="tab" href="#'+(t[0]==='gr'?'gr-'+(CDNAME[sub]&&tab==='gr'?sub:'cd1'):t[0])+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+t[1]+(t[0]==='wrong'?'<span class="n" id="wrongN"></span>':'')+'</a>').join('');
  const V={home:viewHome,pa:viewPA,wf:viewWF,gr:()=>viewGR(sub),wr:viewWR,test:viewTest,wrong:viewWrong};
  $('#app').innerHTML=V[tab]();
  if(tab==='wr')initWR();
  if(tab==='test'&&EX&&!EX.done)examCount();
  updateBadge();
  const cur=$('.tab[aria-current="page"]');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
  if(!route.first){route.first=true}else window.scrollTo(0,0);
  document.title='Ôn thi HSG Tiếng Anh 8';
}
window.addEventListener('hashchange',route);

/* các nút phụ */
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if((b=t.closest('[data-start]'))){startExam(b.dataset.start);route();window.scrollTo(0,0);return}
  if(t.closest('#exSubmit')){submitExam();window.scrollTo(0,0);return}
  if(t.closest('#exCancel')){EX=null;clearInterval(TM);route();return}
  if(t.closest('#exBack')){EX=null;route();return}
  if(t.closest('#resetAll')){
    const bt=$('#resetAll');
    if(bt.dataset.sure){ST.res={};ST.exam=[];save();route()}else{bt.dataset.sure='1';bt.textContent='Bấm lần nữa để xác nhận xóa';}
    return;
  }
  if((b=t.closest('#uchips .chip'))){UF.u=+b.dataset.u;$$('#uchips .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#utable').innerHTML=unitTable();return}
  if(t.closest('#utest')){UF.test=!UF.test;$('#utest').setAttribute('aria-pressed',UF.test);$('#utable').innerHTML=unitTable();return}
  if(t.closest('#ushow')){$$('#utable .cov').forEach(x=>x.classList.add('show'));return}
  if((b=t.closest('.cov'))){b.classList.toggle('show');return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cov')){e.preventDefault();e.target.classList.toggle('show')}});
document.addEventListener('input',e=>{if(e.target.id==='usearch'){UF.q=e.target.value;$('#utable').innerHTML=unitTable()}});
route();


</script>
