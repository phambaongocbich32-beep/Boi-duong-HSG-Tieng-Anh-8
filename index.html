<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi HSG Tiếng Anh 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a single reading column with a sticky tab bar; exercise blocks as ruled "worksheet" cards, ink-blue accent, marker-yellow highlight. */
:root{
  --bg:#f2f4f9;--card:#ffffff;--ink:#16213e;--sub:#56637f;--line:#d7deec;
  --acc:#2447c9;--accbg:#e4ebff;--hl:#ffe98f;--ok:#16794f;--okbg:#e2f5ec;--bad:#bf3a2d;--badbg:#fde9e6;--warnbg:#fff4d6;
  --amb:#9a6200;--font:"Be Vietnam Pro","Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1629;--card:#172038;--ink:#e6ecff;--sub:#a2afd0;--line:#29365a;
  --acc:#8fb0ff;--accbg:#223562;--hl:#5a4d18;--ok:#6fd6a0;--okbg:#14352a;--bad:#ff8f84;--badbg:#401f1c;--warnbg:#3b3416;--amb:#f0c060;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1629;--card:#172038;--ink:#e6ecff;--sub:#a2afd0;--line:#29365a;
  --acc:#8fb0ff;--accbg:#223562;--hl:#5a4d18;--ok:#6fd6a0;--okbg:#14352a;--bad:#ff8f84;--badbg:#401f1c;--warnbg:#3b3416;--amb:#f0c060;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;font-size:16px}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800;margin-bottom:10px}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 10px}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--acc)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-size:1.1rem;font-weight:800;letter-spacing:.2px}
.brand span{font-size:.85rem;color:var(--sub)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--sub);padding:10px 14px;min-height:44px;font-weight:600;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--acc);border-bottom-color:var(--acc);background:var(--accbg)}
.tab .n{margin-left:6px;background:var(--bad);color:#fff;border-radius:10px;font-size:.75rem;padding:0 7px;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:18px 16px 80px}
.sub{color:var(--sub);font-size:.95rem}
.sec{margin:0 0 26px;display:flex;flex-direction:column;gap:14px}
.lead{max-width:68ch}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.hl{border-left:5px solid var(--acc)}
.warn{background:var(--warnbg);border-radius:8px;padding:8px 12px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile:hover{border-color:var(--acc)}
.tile b{font-size:1.02rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}
.stat{font-size:.85rem;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:600}
.btn:hover{background:var(--accbg)}
.btn.pri{background:var(--acc);color:var(--bg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.92rem}
.btn[aria-pressed="true"]{background:var(--acc);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;min-height:38px;font-size:.9rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}

/* theory */
details.th{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0}
details.th>summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:44px;align-items:center}
details.th>summary::after{content:"+";font-size:1.3rem;color:var(--acc);font-weight:400}
details.th[open]>summary::after{content:"–"}
details.th>summary::-webkit-details-marker{display:none}
details.th .body{padding:0 16px 14px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--accbg);font-weight:700}
.body ul,.body ol,.card ul,.card ol{margin:6px 0;padding-left:22px}
.body li,.card li{margin:4px 0}
.body table{margin:8px 0}

/* exercise set */
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.set-h{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--accbg)}
.set-h h3{margin:0}
.score{font-weight:700;font-size:.9rem;color:var(--sub);font-variant-numeric:tabular-nums}
.score.done{color:var(--ok)}
.set-i{padding:10px 16px 0;color:var(--sub);font-size:.93rem}
.qs{padding:6px 16px 14px;display:flex;flex-direction:column}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q .p{display:flex;gap:10px}
.q .no{flex:0 0 auto;color:var(--sub);font-weight:700;min-width:1.7em;font-variant-numeric:tabular-nums}
.q .t{flex:1;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 2.4em}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;min-height:44px;text-align:left;display:inline-flex;gap:8px;align-items:center}
.opt:hover{border-color:var(--acc)}
.opt .l{font-weight:800;color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.fi{font:inherit;border:0;border-bottom:2px solid var(--acc);background:var(--accbg);color:var(--ink);padding:2px 6px;border-radius:4px 4px 0 0;min-width:6ch;max-width:100%}
.fi.ok{border-bottom-color:var(--ok);background:var(--okbg)}
.fi.bad{border-bottom-color:var(--bad);background:var(--badbg)}
.fline{margin:8px 0 0 2.4em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fline .fi{min-width:14ch}
.hint{color:var(--sub);font-size:.9rem}
.fb{margin:8px 0 0 2.4em;padding:8px 12px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ink);border-left:4px solid var(--ok)}
.fb.bad{background:var(--badbg);color:var(--ink);border-left:4px solid var(--bad)}
.fb b.k{color:var(--ok)}
.fb.bad b.k{color:var(--bad)}
.set-f{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}

/* sort rows */
.srow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow .w{font-size:1.08rem;font-weight:600;min-width:9ch}
.srow .opts{margin:0}
.srow .note{flex-basis:100%;font-size:.9rem;color:var(--sub)}
.srow .opt{min-height:40px;padding:5px 12px}

/* cloze */
.cloze{padding:12px 16px 4px;line-height:2.3}
.cloze .fi{min-width:12ch;text-align:center}
.cloze sup{color:var(--sub);font-weight:700;margin-right:2px}

/* word-form units */
.units{display:flex;gap:6px;flex-wrap:wrap}
.uh td{background:var(--accbg);font-weight:800}
.cov{background:var(--line);color:transparent;border-radius:4px;cursor:pointer;user-select:none;padding:0 6px}
.cov.show{background:var(--hl);color:var(--ink)}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tool input[type=search]{font:inherit;padding:8px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);flex:1 1 180px}

/* writing */
.para{font-size:1.05rem;max-width:70ch}
.k{font:inherit;display:inline;min-height:0;padding:0 3px;border:0;border-bottom:2px solid var(--acc);border-radius:3px;background:var(--accbg);color:var(--ink);font-weight:600;cursor:pointer}
.k.on{background:var(--hl)}
.hide .k:not(.shown){color:transparent;background:var(--line);border-bottom-color:var(--sub);user-select:none}
.info{min-height:78px;border-left:4px solid var(--acc);padding:8px 12px;background:var(--accbg);border-radius:6px}
.sn{display:block;margin:3px 0;padding:3px 8px;border-radius:6px;border-left:4px solid transparent}
.sn small{color:var(--sub);font-weight:700;margin-right:6px}
.sn.topic{background:var(--accbg);border-left-color:var(--acc)}
.sn.main{background:var(--hl);border-left-color:var(--ink)}
.sn.detail{background:var(--bg);border-left-color:var(--line)}
.sn.concl{background:var(--okbg);border-left-color:var(--ok)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem}
.legend span{padding:2px 10px;border-radius:12px}
textarea{width:100%;min-height:210px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
select,input[type=number]{font:inherit;padding:8px 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=number]{width:90px}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.auto li{list-style:none;margin-left:-20px}
.chk label{cursor:pointer;display:flex;gap:8px;align-items:flex-start;padding:4px 0;min-height:36px}
.chk input{width:20px;height:20px;margin-top:5px;accent-color:var(--acc)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--sub)}
.big{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}

/* exam */
.exam-bar{position:sticky;top:98px;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.exam-sec{font-weight:800;color:var(--acc);margin:14px 0 0;font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
.hist li{font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--sub)}

@media (max-width:520px){
  h1{font-size:1.4rem}
  .opts,.fb,.fline{margin-left:0}
  .exam-bar{top:92px}
  main{padding-top:14px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.srow .fb{margin:0;flex-basis:100%}
.srow .fbx{flex-basis:100%}

.track{position:relative;height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px 0 0 8px}
.fill.short{background:var(--amb)}.fill.good{background:var(--ok)}.fill.over{background:var(--bad)}
.track .zone{position:absolute;top:0;bottom:0;left:66.667%;width:16.667%;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.45}
.low-t{color:var(--amb);font-weight:700}
.bs{margin:12px 0}
.bs label{display:block;margin-bottom:4px}
.bi{min-height:60px}
.bc{margin-top:2px}

.sp-s{cursor:pointer;border-radius:4px;padding:1px 2px}.sp-s:hover{background:var(--accbg)}.sp-s.on{background:var(--hl)}.spq{white-space:pre-line;font-weight:600;margin:6px 0}.sp-ta{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:8px 0}.sp-par{line-height:1.8}

</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand"><b>HSG Tiếng Anh 8</b><span>Phát âm · Word form · Ngữ pháp · Viết đoạn</span></div><nav class="tabs" id="tabs" aria-label="Các phần"></nav></div></header>
<main id="app"></main>
<script>
/* ===== Helpers ===== */
const mc=(q,o,a,e)=>({k:'mc',q,o,a,e:e||''});
const fl=(q,a,e,h)=>({k:'fill',q,a:[].concat(a),e:e||'',h:h||''});
const fx=(q,a,e)=>({k:'fix',q,a:[].concat(a),e:e||''});
const od=(opts,a,e)=>mc('Chọn từ có phần gạch chân phát âm khác các từ còn lại.',opts,a,e);
const ABC3=['a','an','the'];

/* ===== SETS: each set = one exercise block ===== */
const SETS=[];
const add=s=>SETS.push(s);

/* ---------- PHÁT ÂM ---------- */
add({id:'pa1',sec:'pa',title:'Bài 1. Phân loại /uː/ và /ʊ/',instr:'Chạm vào âm đúng cho phần gạch chân.',type:'sort',cats:['/uː/','/ʊ/'],
items:[['f<u>oo</u>d',0,'/fuːd/'],['w<u>oo</u>d',1,'/wʊd/'],['gr<u>ou</u>p',0,'/gruːp/'],['c<u>ou</u>ld',1,'/kʊd/'],['j<u>ui</u>ce',0,'/dʒuːs/'],['b<u>oo</u>k',1,'/bʊk/'],['t<u>oo</u>th',0,'/tuːθ/'],['w<u>o</u>lf',1,'/wʊlf/'],['t<u>oo</u>l',0,'/tuːl/'],['sh<u>ou</u>ld',1,'/ʃʊd/'],['rem<u>o</u>ve',0,'/rɪˈmuːv/'],['w<u>o</u>man',1,'/ˈwʊmən/'],['cr<u>ui</u>se',0,'/kruːz/'],['g<u>oo</u>d',1,'/gʊd/']]});

add({id:'pa2',sec:'pa',title:'Bài 2. Tìm từ có phần gạch chân phát âm khác (/uː/, /ʊ/)',instr:'Chọn đáp án đúng.',type:'list',qs:[
od(['f<u>oo</u>d','f<u>oo</u>t','h<u>oo</u>k','w<u>oo</u>d'],0,'food /fuːd/; foot /fʊt/, hook /hʊk/, wood /wʊd/ đều là /ʊ/.'),
od(['gr<u>ou</u>p','sh<u>ou</u>ld','w<u>ou</u>ld','c<u>ou</u>ld'],0,'group /gruːp/ là /uː/; should, would, could là /ʊ/.'),
od(['fr<u>ui</u>t','s<u>ui</u>t','j<u>ui</u>ce','b<u>ui</u>ld'],3,'fruit, suit, juice là /uː/; build /bɪld/ là /ɪ/.'),
od(['l<u>o</u>se','impr<u>o</u>ve','m<u>o</u>vie','d<u>o</u>ve'],3,'lose /luːz/, improve /ɪmˈpruːv/, movie /ˈmuːvi/ là /uː/; dove /dʌv/ là /ʌ/.'),
od(['p<u>u</u>ll','l<u>u</u>nar','f<u>u</u>ll','p<u>u</u>t'],1,'pull, full, put là /ʊ/; lunar /ˈluːnə/ là /uː/.'),
od(['f<u>oo</u>t','b<u>oo</u>ts','l<u>oo</u>k','b<u>oo</u>k'],1,'foot, look, book là /ʊ/; boots /buːts/ là /uː/.'),
od(['p<u>oo</u>l','c<u>oo</u>k','st<u>oo</u>d','w<u>oo</u>l'],0,'pool /puːl/ là /uː/; cook, stood, wool là /ʊ/.'),
od(['f<u>oo</u>t','f<u>oo</u>d','c<u>oo</u>l','r<u>oo</u>t'],0,'foot /fʊt/ là /ʊ/; food, cool, root là /uː/.'),
od(['r<u>u</u>de','p<u>u</u>ll','r<u>u</u>le','incl<u>u</u>de'],1,'pull /pʊl/ là /ʊ/; rude, rule, include là /uː/.'),
od(['p<u>u</u>sh','g<u>oo</u>d','m<u>o</u>ve','c<u>ou</u>ld'],2,'move /muːv/ là /uː/; push, good, could là /ʊ/.'),
od(['gr<u>ou</u>p','thr<u>ew</u>','gl<u>ue</u>','w<u>oo</u>d'],3,'wood /wʊd/ là /ʊ/; group, threw /θruː/, glue /gluː/ là /uː/.'),
od(['w<u>oo</u>dland','p<u>u</u>shy','s<u>oo</u>n','b<u>u</u>sh'],2,'soon /suːn/ là /uː/; woodland /ˈwʊdlənd/, pushy /ˈpʊʃi/, bush /bʊʃ/ là /ʊ/.'),
od(['c<u>ou</u>ld','can<u>oe</u>','sh<u>oe</u>','t<u>o</u>mb'],0,'could /kʊd/ là /ʊ/; canoe /kəˈnuː/, shoe /ʃuː/, tomb /tuːm/ là /uː/.'),
od(['s<u>u</u>gar','bl<u>ue</u>','fl<u>u</u>','j<u>u</u>ne'],0,'sugar /ˈʃʊgə/ là /ʊ/; blue, flu, June là /uː/.'),
od(['h<u>oo</u>d','t<u>oo</u>k','sm<u>oo</u>th','w<u>oo</u>l'],2,'smooth /smuːð/ là /uː/; hood, took, wool là /ʊ/.')
]});

add({id:'pa3',sec:'pa',title:'Bài 3. Phân loại /ə/ và /ɪ/',instr:'Chạm vào âm đúng cho phần gạch chân.',type:'sort',cats:['/ə/','/ɪ/'],
items:[['b<u>a</u>nana',0,'/bəˈnænə/'],['vill<u>a</u>ge',1,'/ˈvɪlɪdʒ/ (âm cuối -age đọc /ɪdʒ/)'],['answ<u>e</u>r',0,'/ˈænsə/'],['b<u>e</u>come',1,'/bɪˈkʌm/ (tiền tố be-)'],['<u>a</u>tom',0,'/ˈætəm/'],['w<u>i</u>n',1,'/wɪn/'],['pict<u>u</u>re',0,'/ˈpɪktʃə/'],['b<u>ui</u>ld',1,'/bɪld/'],['fam<u>ou</u>s',0,'/ˈfeɪməs/'],['b<u>e</u>have',1,'/bɪˈheɪv/'],['sil<u>e</u>nt',0,'/ˈsaɪlənt/'],['cott<u>a</u>ge',1,'/ˈkɒtɪdʒ/'],['c<u>o</u>mpare',0,'/kəmˈpeə/'],['m<u>i</u>ss',1,'/mɪs/'],['s<u>u</u>ggest',0,'/səˈdʒest/'],['g<u>ui</u>lt',1,'/gɪlt/']]});

add({id:'pa4',sec:'pa',title:'Bài 4. Tìm từ có phần gạch chân phát âm khác',instr:'Chọn đáp án đúng.',type:'list',qs:[
od(['n<u>o</u>rmal','visit<u>o</u>rs','transp<u>o</u>rt','ch<u>o</u>re'],1,'normal /ˈnɔːml/, transport /ˈtrænspɔːt/, chore /tʃɔː/ có /ɔː/; visitors /ˈvɪzɪtəz/ có /ə/.'),
od(['b<u>a</u>sic','m<u>a</u>jor','cr<u>a</u>ft','r<u>a</u>cing'],2,'basic /ˈbeɪsɪk/, major /ˈmeɪdʒə/, racing /ˈreɪsɪŋ/ có /eɪ/; craft /krɑːft/ có /ɑː/.'),

  "Khung đề xuất: <b>Mở</b> (I'd like to talk about…) → <b>What/Who</b> → <b>When/Where</b> → <b>Chi tiết + ví dụ</b> → <b>Vì sao quan trọng / cảm xúc</b> → <b>Kết</b> (All in all…).",
  "Mục tiêu nói đủ 1,5–2 phút, khoảng 150–190 từ. Nếu hết ý, kể thêm một ví dụ cụ thể.",
  "Nói chậm, rõ. Mắc lỗi thì sửa nhanh rồi nói tiếp, đừng dừng lại xin lỗi."],
 mistakes:["Chỉ trả lời 2 trên 4 ý của thẻ.","Nói dưới 1 phút rồi dừng.","Ghi chú thành câu dài nên chỉ biết đọc.","Dùng toàn thì hiện tại, quên thì quá khứ khi kể chuyện."],
 timer:true,
 items:[
 {h:"Cue card 1: Hobby",q:"Describe a hobby or activity you enjoy doing in your free time.\nYou should say:\n• what it is\n• when and where you do it\n• who you do it with\nand explain why you enjoy it.",hint:"Gợi ý ghi chú: badminton – Saturday, sports hall – 3 friends – fit, relax, teamwork",a:"I'd like to talk about playing badminton, which is my favorite free time activity. I usually play it on Saturday afternoons at the sports hall near my house, and sometimes after school in the yard. I play with three close friends from my class. We started two years ago, after our PE teacher showed us the basic rules, and we have been addicted ever since. First of all, it helps me stay fit and gives me more energy for my lessons. Secondly, it is a great chance to chat with my friends and forget about exam stress. For example, last month we held a small tournament, and although I lost in the final, I laughed so much that my worries disappeared. Besides, playing in a team teaches me to cooperate and stay calm under pressure. All in all, badminton is not just a sport for me. It is a way to relax, make memories and build friendships."},
 {h:"Cue card 2: A good friend",q:"Describe a good friend of yours.\nYou should say:\n• who this person is\n• how you met\n• what you do together\nand explain why this person is important to you.",hint:"Gợi ý ghi chú: Minh – grade 6, English class – football, revise – honest, helpful",a:"I'm going to describe my best friend, Minh. We met in grade six, when we were seated next to each other in an English class. At first he was shy, but we soon discovered that we both love football and comics, so we became close. Nowadays we usually walk home together, revise for tests and play football at the weekend. What I admire most about Minh is that he is honest and always willing to help. For instance, when I failed a math test last term, he stayed after school to explain the lesson to me patiently. Because of him, I improved my grades and felt much more confident. He also makes me laugh when I am stressed. To sum up, Minh is important to me because he supports me in good times and bad times, and I hope our friendship will last for many years."},
 {h:"Cue card 3: A place in the countryside",q:"Describe a place in the countryside that you have visited.\nYou should say:\n• where it is\n• when you went there\n• what you did there\nand explain why you remember it.",hint:"Gợi ý ghi chú: grandparents' village – last summer, a week – fishing, kites – peaceful, friendly",a:"I'd like to talk about my grandparents' village, which is about sixty kilometers from my city. I went there last summer and stayed for a week. The village is surrounded by rice fields, and a small river runs through it. During my stay, I helped my grandfather feed the buffaloes, went fishing with my cousins and flew kites in the evening. I also joined my grandmother in cooking meals with fresh vegetables from the garden. I remember this trip clearly because life there was so peaceful compared with the city. There was no traffic noise, the air was fresh and the neighbors were very friendly. For example, one evening everyone shared fruit and told stories under the big tree. It made me realize that simple things can bring a lot of happiness. That is why I want to visit again next summer."},
 {h:"Cue card 4: Feeling under pressure",q:"Describe a time when you felt under pressure.\nYou should say:\n• when it happened\n• what caused it\n• how you dealt with it\nand explain how you felt afterwards.",hint:"Gợi ý ghi chú: midterm exams – 6 subjects, contest – timetable, talk to mom, sports – proud, relieved",a:"A time I felt under pressure was last semester, before the midterm exams. I had to revise six subjects while also practicing for a school English contest. Because of that, I slept late and felt tired and worried every day. At first, I tried to do everything at once, but it did not work. Then I talked to my mother, who advised me to make a timetable and take short breaks. I also played badminton twice a week to clear my mind. Little by little, I felt calmer and could focus better. In the end, I got good marks and even won second prize in the contest. Afterwards I felt proud and relieved, and I learned that planning and talking to people I trust can reduce stress a lot."}]},
ielts3:{
 title:"IELTS Speaking Part 3: Thảo luận chuyên sâu",
 time:"4–5 phút. Giám khảo hỏi các câu trừu tượng, liên quan đến chủ đề Part 2 (ý kiến, so sánh, nguyên nhân, dự đoán).",
 steps:[
  "Công thức <b>P-E-E-L</b>: <b>P</b>oint (nêu quan điểm) → <b>E</b>xplain (giải thích) → <b>E</b>xample (ví dụ) → <b>L</b>ink (kết nối, đối lập). Mỗi câu trả lời 3–5 câu, 40–70 từ.",
  "Nói về <b>người ta nói chung</b> (many people, teenagers), không kể chuyện riêng mình như Part 1.",
  "Dùng cấu trúc so sánh và đối lập: however, in contrast, whereas, although.",
  "Câu hỏi khó thì câu giờ bằng That's an interesting question, I haven't thought about it much, but I'd say…",
  "Có thể nêu hai mặt (advantages / disadvantages) rồi chốt quan điểm của mình."],
 mistakes:["Trả lời bằng chuyện cá nhân thay vì ý kiến chung.","Chỉ nói I think… rồi dừng, thiếu lý do.","Dùng đại từ không rõ (they, it) khiến ý lộn xộn.","Quên mạo từ và số nhiều: teenager has → teenagers have."],
 items:[
 {h:"Leisure",q:"Why do some people prefer outdoor activities to indoor ones?",a:"I think it is because outdoor activities are good for both body and mind. People can breathe fresh air, exercise and meet others. In contrast, indoor activities like gaming can be fun, but they often keep people sitting for hours, which is not healthy."},
 {h:"Leisure",q:"Do you think young people today have enough free time?",a:"Not really. Many students attend extra classes and have a lot of homework, so they have little time left to relax. As a result, they may feel stressed and tired. I believe schools should reduce homework so that teenagers can enjoy their hobbies and rest."},
 {h:"Friendship",q:"How important is it for teenagers to have close friends?",a:"I think it is very important. Close friends listen to us and give advice when we face difficulties. For example, if a student fails an exam, his friends can encourage him to try again. Without friends, teenagers may feel lonely and lose confidence."},
 {h:"Friendship",q:"Is it better to have a few close friends or many casual friends?",a:"In my opinion, a few close friends are better. Although many casual friends can make you popular, they may not support you when you need help. Close friends, on the other hand, are more trustworthy and understand you well."},
 {h:"Countryside and city",q:"What are the advantages and disadvantages of living in the countryside?",a:"The main advantages are fresh air, a peaceful life and a strong community. However, the countryside usually has fewer schools, hospitals and job opportunities. That is why many young people move to cities, although some of them return later."},
 {h:"Countryside and city",q:"Why do many young people leave the countryside for the city?",a:"Mostly for education and better jobs. Cities have more universities and companies, so young people expect a higher income there. Another reason is entertainment, because cities offer cinemas, shopping malls and many other activities."},
 {h:"Teenagers and pressure",q:"What causes pressure for teenagers today?",a:"There are several causes, such as exams, expectations from parents and comparison with friends on social media. If the pressure is too high, teenagers may lose sleep and confidence. Therefore, adults should listen to them instead of only asking for good marks."},
 {h:"Teenagers and pressure",q:"How can teenagers deal with stress?",a:"They can do sports, share their problems with family or friends and plan their time carefully. Schools can also help by offering counselling and organizing relaxing activities. In my view, talking openly about stress is the most effective way."}]},

 title:"VSTEP B2 Speaking Part 1: Social interaction (tương tác xã hội)",

 steps:[
  "Trả lời đầy đủ 2–4 câu mỗi câu hỏi: nêu ý chính, lý do, ví dụ ngắn.",
  "Giọng tự nhiên, nhìn giám khảo, có thể dùng từ nối nhẹ: Well, Actually, To be honest.",
  "Dùng đa dạng thì và cấu trúc: hiện tại đơn, quá khứ đơn, tương lai (I'm going to…), câu có because / although.",
  "Tránh lặp lại đúng từ trong câu hỏi, hãy diễn đạt lại bằng từ khác."],
 mistakes:["Trả lời một câu đơn.","Nói lan man sang chuyện khác.","Phát âm cuối từ bị nuốt: stress, friends, helps.","Nhấn sai âm tiết ở từ dài: im-POR-tant, com-mu-ni-CA-tion."],
 items:[
 {h:"Topic: Hobbies",q:"1. What hobbies do you have?\n2. How often do you do it?\n3. Do you think hobbies are important for teenagers?",a:"I have a few hobbies, but my favorite one is playing badminton. I play it about twice a week, usually at the weekend with my friends. I think hobbies are very important for teenagers because they help us relax after stressful school days. Besides, we can learn new skills and make new friends through them."},
 {h:"Topic: Hobbies",q:"4. Did you have the same hobbies when you were a child?\n5. Would you like to try any new hobby in the future?",a:"Not exactly. When I was a child, I loved drawing and watching cartoons, but now I prefer sports. In the future, I would like to learn how to play the guitar because music makes me feel happy and calm."},
 {h:"Topic: Hometown",q:"1. Where do you live now?\n2. What do you like about your area?\n3. Is there anything you would like to change?",a:"I live in a small town near the river. What I like most is that it is quiet and the people are friendly. If I could change one thing, I would build more parks and libraries, so young people would have more places to study and relax."},
 {h:"Topic: Hometown",q:"4. How has your hometown changed in recent years?\n5. Would you recommend it to tourists?",a:"It has changed quite a lot. There are more shops and better roads, and many families now have fast internet. I would definitely recommend it to tourists who love nature, because they can enjoy fresh air, local food and beautiful scenery."}]},
v2:{
 title:"VSTEP B2 Speaking Part 2: Solution discussion (thảo luận giải pháp)",
 time:"Khoảng 4 phút, gồm 1 phút chuẩn bị. Đề cho một tình huống và 3 giải pháp, em chọn giải pháp tốt nhất và giải thích.",
 steps:[
  "Mở bài: nhắc lại tình huống (In this situation, …), nói sẽ chọn phương án nào.",
  "Giải thích vì sao chọn: 2 lý do, mỗi lý do có ví dụ hoặc hệ quả.",
  "Nói vì sao <b>không chọn</b> hai phương án còn lại (mỗi phương án 1–2 câu, nêu điểm yếu).",
  "Kết: chốt lại lựa chọn bằng câu All things considered, I believe option … is the best.",
  "Cấu trúc đề xuất: tình huống → chọn → 2 lý do → loại hai phương án kia → kết."],
 mistakes:["Chỉ mô tả cả ba phương án mà không chọn.","Chọn nhưng không giải thích rõ.","Quên nêu vì sao loại hai phương án còn lại.","Dùng sai cấu trúc so sánh: more better, more cheaper."],
 timer:true,
 items:[
 {h:"Situation 1: End-of-term activity",q:"Your school wants to organize a leisure activity for students at the end of the term. There are three options:\nA. a picnic in the countryside\nB. a sports tournament\nC. a movie day at school\nWhich option is the best and why?",hint:"Gợi ý: chọn A, lý do: gần thiên nhiên và gắn kết bạn bè; B chỉ hợp người giỏi thể thao; C ít vận động, giống ngày học.",a:"In my opinion, the best option is a picnic in the countryside. First of all, it gives students a chance to breathe fresh air and escape from the pressure of exams. Secondly, it helps classmates become closer, because they can play games, cook and chat together. For example, when my class went on a picnic last year, even shy students joined in and made new friends. As for the sports tournament, it is exciting, but only students who are good at sports can really enjoy it, and some may feel left out. The movie day sounds relaxing, but students would sit for hours in a room that looks like their classroom, so it is not special enough. All things considered, I believe the picnic is the best choice."},
 {h:"Situation 2: Reducing stress",q:"A friend of yours feels stressed because of schoolwork. Here are three ways to help:\nA. doing sports regularly\nB. talking to parents or friends\nC. listening to music and taking a break\nWhich one is the best?",hint:"Gợi ý: chọn B, lý do: giải quyết gốc vấn đề; A, C chỉ tạm thời hoặc cần thời gian.",a:"I think the best solution is talking to parents or friends. To begin with, when we share our worries, we feel understood, and the problem often seems smaller. Furthermore, parents and friends can give practical advice, such as how to make a study plan. For instance, my friend was very worried before the exams, but after talking to her older sister, she felt much calmer. Doing sports is good for health, but it needs time and does not solve the real problem. Listening to music can help for a short time, yet the stress comes back when the work is still there. Therefore, I would choose talking to people we trust."}]},
v3:{
 title:"VSTEP B2 Speaking Part 3: Topic development (phát triển chủ đề)",
 time:"Khoảng 5 phút, gồm 1 phút chuẩn bị. Em nói khoảng 2 phút về một chủ đề với các ý gợi ý, sau đó trả lời 1–2 câu hỏi thêm.",
 steps:[
  "Dùng sơ đồ ý (mind map) đề cho. Chọn 2–3 ý, không cần nói hết.",
  "Cấu trúc: <b>Mở</b> (nêu chủ đề và quan điểm) → <b>Ý 1 + ví dụ</b> → <b>Ý 2 + ví dụ</b> → <b>Ý đối lập / giải pháp</b> → <b>Kết</b>.",
  "Nói khoảng 2 phút (khoảng 180–220 từ). Dùng từ nối: Firstly, In addition, However, Therefore.",
  "Câu hỏi thêm: trả lời bằng PEEL (Point, Explain, Example, Link) trong 3–4 câu.",

 mistakes:["Nói lan man, thiếu cấu trúc rõ.","Chỉ liệt kê ý mà không giải thích.","Quá phụ thuộc vào ghi chú, ít nhìn giám khảo.","Câu hỏi thêm trả lời quá ngắn."],
 timer:true,
 items:[
 {h:"Topic 1: Outdoor activities for teenagers",q:"Should teenagers spend more time on outdoor activities?\nIdeas: health – friendship – less screen time",a:"I strongly believe that teenagers should spend more time on outdoor activities. Firstly, outdoor activities are good for health. When teenagers play sports or go cycling, they stay fit and sleep better. In addition, they help young people build friendships. For example, when my friends and I play football after school, we learn to cooperate and trust each other. Another benefit is that teenagers spend less time looking at screens. Nowadays many students play games or scroll through social networks for hours, which makes them tired and less creative. However, some students have too much homework, so schools should organize more outdoor activities during school time. In conclusion, outdoor activities bring both physical and mental benefits, and parents and schools should encourage them.\n\nFollow-up: What outdoor activities are popular in your area?\nIn my area, many people go jogging in the park in the morning, and young people play football or badminton in the evening. At weekends, some families go cycling along the river. These activities are cheap and good for health."},
 {h:"Topic 2: Life in the countryside",q:"Is life in the countryside better than life in the city?\nIdeas: environment – community – opportunities",a:"In my opinion, life in the countryside has more advantages than life in the city, especially for children and old people. To begin with, the environment is cleaner. The air is fresh, there is less noise and people can live close to nature. Moreover, the community is stronger. Neighbors know each other and often help one another, which makes people feel safe. For instance, when a family in my grandparents' village needs help, everyone comes to support them. On the other hand, the countryside has fewer job opportunities and fewer modern facilities such as hospitals or universities. Therefore, I think the best solution is to improve the countryside, for example by building better schools and roads, so that young people do not need to leave. All in all, the countryside is a great place to live if it is developed well.\n\nFollow-up: Would you like to live in the countryside in the future?\nProbably yes, but not now. I would like to study in the city first to have better education, and later I would come back to live near my family, where the air is fresh and life is peaceful."}]}

SPK.debate={
 title:"Debate: Tranh biện theo đề (motion)",
 time:"Mỗi đội có 1–2 phút chuẩn bị, nói khoảng 1–2 phút, sau đó phản biện đội bạn. Dùng cho thi nói theo nhóm, câu lạc bộ tiếng Anh và để luyện lập luận cho IELTS Part 3, VSTEP Part 3.",
 steps:[
  "<b>Hiểu đề (motion):</b> đọc kỹ rồi xác định mình ở đội <b>Ủng hộ</b> (Proposition / For) hay <b>Phản đối</b> (Opposition / Against). Mình phải bảo vệ lập trường được giao, kể cả khi không đồng ý.",
  "<b>Chuẩn bị 1–2 phút:</b> chọn đúng 3 luận điểm. Với mỗi luận điểm, ghi từ khóa của <b>Claim (ý chính) – Reason (lý do) – Example (ví dụ)</b>.",
  "<b>Khung bài nói:</b> Chào (Good morning) → Nêu lập trường (We strongly agree / disagree that…) → Luận điểm 1, 2, 3 (Firstly, Secondly, Finally) → Kết (For these reasons… Thank you).",
  "<b>Phản biện 4 bước:</b> (1) Nhắc lại ý đối phương → (2) Chỉ ra điểm yếu → (3) Đưa lý lẽ hoặc ví dụ phản bác → (4) Kết luận ý mình vẫn đúng.",
  "<b>Thái độ:</b> lịch sự, phản bác ý kiến chứ không công kích người. Nói chậm, rõ, nhìn người nghe, giữ giọng tự tin.",
  "<b>Luyện:</b> nói đủ cả hai phía (For và Against) cho cùng một đề. Cách này giúp tìm được lý lẽ đối phương sẽ dùng."],
 mistakes:["Chỉ nêu ý kiến, không có lý do và ví dụ.","Nói lệch lập trường (đang ủng hộ nhưng lại nói ý phản đối).","Liệt kê quá nhiều ý nên không ý nào được giải thích.","Công kích cá nhân thay vì phản bác lập luận.","Không phản biện hoặc phản biện quá chung chung.","Dùng sai thì và mạo từ khi nói nhanh."],
 phrases:[
  ["Good morning, everyone. Our team believes that…","Chào mọi người. Đội chúng tôi tin rằng…"],
  ["We strongly agree / disagree that…","Chúng tôi hoàn toàn đồng ý / không đồng ý rằng…"],
  ["Firstly, … Secondly, … Finally, …","Thứ nhất… Thứ hai… Cuối cùng…"],
  ["This is because…","Điều này là vì…"],
  ["A good example is…","Một ví dụ điển hình là…"],
  ["The other team said that…","Đội bạn cho rằng… (nhắc lại ý đối phương)"],
  ["We understand that…, but…","Chúng tôi hiểu rằng…, nhưng… (nhượng bộ rồi phản bác)"],
  ["That argument does not hold because…","Lập luận đó chưa đúng vì…"],
  ["Not only…, but also…","Không chỉ… mà còn… (nhấn mạnh)"],
  ["For these reasons, we firmly believe…","Vì những lý do trên, chúng tôi tin chắc rằng… (kết bài)"]],
 timer:true,
 items:[
 {h:"Motion 1 (For): Outdoor vs online",q:"Motion: Teenagers should spend more free time outdoors than online.\nYour side: For (Ủng hộ).",a:"Good morning, everyone. We strongly agree that teenagers should spend more free time outdoors than online. Firstly, outdoor activities keep us healthy. When teenagers play sports or go cycling, they stay fit and sleep better, while hours in front of a screen cause tired eyes and bad posture. Secondly, being outdoors helps us build real friendships. For example, when we play football together, we learn teamwork and trust, which online chatting cannot fully give. Finally, nature helps us reduce stress after hard school days. For these reasons, we believe teenagers should choose the outdoors first. Thank you."},
 {h:"Motion 1 (Against): Outdoor vs online",q:"Motion: Teenagers should spend more free time outdoors than online.\nYour side: Against (Phản đối).",a:"Good morning, everyone. We disagree that teenagers should spend more free time outdoors than online. Firstly, the internet is a powerful learning tool. Teenagers can watch lessons, practice English and find information in seconds. Secondly, going outdoors is not always possible. In big cities there are few safe parks, and bad weather or heavy traffic can make it difficult. Finally, online activities help us stay connected with friends and family who live far away. The important thing is balance, not forcing teenagers to give up technology. Therefore, we believe teenagers should be free to choose. Thank you."},
 {h:"Motion 2 (For): Countryside vs city",q:"Motion: Life in the countryside is better than life in the city for teenagers.\nYour side: For (Ủng hộ).",a:"Good morning, everyone. We strongly agree that life in the countryside is better for teenagers. Firstly, the environment is cleaner and quieter. Teenagers breathe fresh air and have more space to play, which is good for both body and mind. Secondly, the community is closer. Neighbors know each other and look after one another, so teenagers feel safe and supported. For example, during harvest time, the whole village works together and children learn to share. Finally, life is less stressful because there is less traffic and less competition. For these reasons, the countryside is a better place for teenagers to grow up. Thank you."},
 {h:"Motion 2 (Against): Countryside vs city",q:"Motion: Life in the countryside is better than life in the city for teenagers.\nYour side: Against (Phản đối).",a:"Good morning, everyone. We disagree that life in the countryside is better for teenagers. Firstly, cities offer better education. There are more good schools, libraries and English clubs, so students have more chances to develop. Secondly, cities have more facilities, such as hospitals, sports centers and public transport. This makes daily life more convenient. Finally, cities give teenagers more opportunities for the future, including internships and different careers. Of course, the countryside is peaceful, but peace alone does not help teenagers succeed. Therefore, we believe the city is a better choice. Thank you."},
 {h:"Motion 3 (For): Homework",q:"Motion: Schools should give less homework.\nYour side: For (Ủng hộ).",a:"Good morning, everyone. We strongly agree that schools should give less homework. Firstly, too much homework causes stress. Many students stay up late to finish it, so they feel tired and cannot concentrate in class. Secondly, students need time for other activities. Sports, hobbies and family time help teenagers develop skills that books cannot teach. For example, playing in a team teaches cooperation and confidence. Finally, quality is more important than quantity. A few well-designed exercises are more useful than a long list of boring tasks. For these reasons, schools should reduce homework. Thank you."},
 {h:"Motion 3 (Against): Homework",q:"Motion: Schools should give less homework.\nYour side: Against (Phản đối).",a:"Good morning, everyone. We disagree that schools should give less homework. Firstly, homework helps students review what they learned in class. Without practice, they forget new knowledge quickly. Secondly, homework teaches responsibility and self-study habits, which are very useful for the future. For example, a student who finishes tasks on time at fourteen will manage university work more easily. Finally, homework lets parents and teachers see how well students are learning. The problem is not homework itself but how it is designed. Therefore, schools should improve homework, not remove it. Thank you."},
 {h:"Motion 4 (For): Social networks",q:"Motion: Social networks do more harm than good to teenagers.\nYour side: For (Ủng hộ).",a:"Good morning, everyone. We strongly agree that social networks do more harm than good to teenagers. Firstly, they waste time. Many teenagers scroll for hours, so they have less time to study, sleep and exercise. Secondly, they affect mental health. Teenagers compare themselves with others online, and this can make them feel worried and not confident. Finally, they can be unsafe, because strangers and bad content are easy to find. Social networks may help us chat, but the risks are greater than the benefits. For these reasons, we believe the harm is bigger. Thank you."},
 {h:"Motion 4 (Against): Social networks",q:"Motion: Social networks do more harm than good to teenagers.\nYour side: Against (Phản đối).",a:"Good morning, everyone. We disagree that social networks do more harm than good. Firstly, they help teenagers stay connected. Students can chat with friends, join study groups and share homework easily. Secondly, they offer a lot of useful information, such as English lessons and science videos. Finally, they help teenagers express themselves and find people with the same interests. Of course, there are risks, but teenagers can avoid them by limiting their time and learning to be careful. Used wisely, social networks bring more good than harm. Thank you."},
 {h:"Rebuttal practice 1",q:"The other team (Against) said: Online learning is more useful than outdoor activities.\nNow give a rebuttal for the For team (Motion 1).",hint:"Khung phản biện: nhắc lại ý đối phương → chỉ điểm yếu → lý lẽ hoặc ví dụ → kết luận.",a:"The other team said that online learning is more useful than outdoor activities. We understand that the internet helps students learn, but that does not mean teenagers should spend most of their free time online. Free time is for rest, not for more studying. Moreover, too much screen time makes students tired, and a tired student cannot learn well. So outdoor activities actually support learning. Therefore, this point does not weaken our case."},
 {h:"Rebuttal practice 2",q:"The other team (Against) said: The countryside has fewer opportunities for teenagers.\nNow give a rebuttal for the For team (Motion 2).",hint:"Khung phản biện: nhắc lại ý đối phương → chỉ điểm yếu → lý lẽ hoặc ví dụ → kết luận.",a:"The other team said that the countryside has fewer opportunities. We agree that cities have more companies, but opportunities are not only about jobs. Teenagers need a healthy environment and a supportive community to build character first. Besides, today the internet allows country students to join online classes and clubs. Therefore, the countryside can still offer a good future, and our case stands."}]};

/* ===== Speaking: giọng mẫu, thu âm, chấm điểm, sửa lỗi, nói lại ===== */
const SP_LEN={ielts1:[20,55],ielts2:[130,210],ielts3:[40,90],v1:[25,70],v2:[110,200],v3:[150,260],debate:[80,170]};
const SPI={},SPH={};
let SPV=null,SPR=0.9,SPQ=0,SPREC=null;
const SPSR=window.SpeechRecognition||window.webkitSpeechRecognition;
function spPickVoice(){
  if(!window.speechSynthesis)return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US$/i.test(v.lang));
  const pref=[/Google US English/i,/Microsoft (Aria|Jenny|Guy|Ana|Davis)/i,/Samantha|Allison|Ava|Nicky|Alex/i,/Zira|David|Mark/i];
  for(const p of pref){const v=vs.find(x=>p.test(x.name));if(v)return v}
  return vs[0]||null;
}
function spVoiceInfo(){
  const el=$('#spVoice');if(!el)return;
  if(!window.speechSynthesis){el.innerHTML='<span class="bad-t">Trình duyệt này không hỗ trợ đọc mẫu. Hãy dùng Chrome hoặc Edge.</span>';return}
  SPV=spPickVoice();
  el.innerHTML=SPV?'Giọng đang dùng: <b>'+esc(SPV.name)+'</b> ('+esc(SPV.lang)+', Anh Mỹ)':'<span class="bad-t">Máy chưa có giọng Anh Mỹ (en-US). Chrome hoặc Edge trên máy tính thường có sẵn. Máy sẽ dùng giọng tiếng Anh mặc định.</span>';
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=spVoiceInfo;
function spStop(){SPQ++;if(window.speechSynthesis)speechSynthesis.cancel();$$('.sp-s.on').forEach(x=>x.classList.remove('on'))}
function spSpeak(sents,els){
  if(!window.speechSynthesis)return;
  spStop();const tok=SPQ;let i=0;
  const next=()=>{
    if(tok!==SPQ)return;
    $$('.sp-s.on').forEach(x=>x.classList.remove('on'));
    if(i>=sents.length)return;
    const u=new SpeechSynthesisUtterance(sents[i]);u.lang='en-US';if(SPV)u.voice=SPV;u.rate=SPR;
    const el=els&&els[i];if(el)el.classList.add('on');
    u.onend=()=>{i++;next()};u.onerror=()=>{i++;next()};
    speechSynthesis.speak(u);
  };
  setTimeout(next,60);
}
function spModelHTML(id,text){

/* ----- chấm điểm bài nói ----- */
const SP_Q_STOP=['describe','should','explain','which','there','situation','option','options','ideas','what','when','where','your','have','about','their','these','topic','usually','often','would','think','good','best'];
function spSuggest(chunks,model){
  const fixes=[],rep=[],weak=[];
  chunks.forEach((c,i)=>{const r=fixSent(c,true);if(r.notes.length)fixes.push({no:i+1,orig:c,fixed:r.fixed,notes:r.notes});WEAK.forEach(w=>{if(w[0].test(c))weak.push(w[1])})});
  const text=chunks.join(' ').toLowerCase(),words=text.match(/[a-z']+/g)||[],freq={};
  words.forEach(w=>{if(w.length>3&&!LG_STOP.has(w))freq[w]=(freq[w]||0)+1});
  Object.keys(freq).filter(w=>freq[w]>=3).sort((a,b)=>freq[b]-freq[a]).slice(0,5).forEach(w=>rep.push({w:w,c:freq[w],syn:SYN[w]||SYN[w.replace(/s$/,'')]||[]}));
  const have=new Set(words),miss={};
  (model.toLowerCase().match(/[a-z']{6,}/g)||[]).forEach(w=>{if(!have.has(w)&&!LG_STOP.has(w))miss[w]=1});
  return{fixes:fixes,rep:rep,weak:[...new Set(weak)].slice(0,6),missing:Object.keys(miss).slice(0,10)};
}
function spGrade(id,chunks,conf,secs){
  const m=SPI[id],L=SP_LEN[m.part],text=chunks.join(' '),n=wc(text),low=text.toLowerCase();
  const words=low.match(/[a-z']+/g)||[];
  const key=(m.q.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!LG_STOP.has(w)&&SP_Q_STOP.indexOf(w)<0);
  const relevant=!key.length||key.some(k=>low.includes(k.slice(0,Math.max(4,k.length-2))));
  const conn=[...new Set(LG_CONN.filter(c=>new RegExp('(^|[^a-z])'+c+'([^a-z]|$)').test(low)))];
  const reason=/because|for example|for instance|so that|since|such as/.test(low);
  const sug=spSuggest(chunks,m.a);
  const e=sug.fixes.reduce((a,x)=>a+x.notes.length,0);
  const complex=chunks.filter(s=>/\b(because|when|if|although|while|which|who|whenever|where|so that)\b/i.test(s)).length;
  const adv=[...new Set(words.filter(w=>LG_ADV.includes(w)))];
  const wpm=(secs&&secs>=8)?Math.round(n/(secs/60)):null;
  const cs=conf&&conf.length?conf.reduce((a,b)=>a+b,0)/conf.length:null;
  let c=0;const cc=[];
  c+=n>=L[0]?1.5:n>=L[0]*0.6?1:0.5;cc.push(n+' từ (mục tiêu '+L[0]+'–'+L[1]+')');
  c+=reason?0.75:0;c+=conn.length>=2?0.75:conn.length?0.25:0;
  cc.push(reason?'Có lý do hoặc ví dụ':'Chưa có lý do / ví dụ');cc.push(conn.length?'Từ nối: '+conn.join(', '):'Chưa dùng từ nối');
  if(!relevant){c-=0.5;cc.push('Chưa thấy từ khóa của câu hỏi, hãy nhắc lại ý câu hỏi ở câu đầu')}
  if(wpm!==null){cc.push('Tốc độ khoảng '+wpm+' từ/phút (chuẩn 100–150)');if(wpm<70)c-=0.5}
  c=Math.max(0,Math.min(3,Math.round(c*2)/2));
  const reps=sug.rep.filter(r=>r.c>=4).length;
  let v=(adv.length>=3&&reps===0)?2:(adv.length>=1||reps===0)?1.5:1;
  if(n<L[0]*0.5)v=Math.min(v,1);
  const vc='Từ vựng nổi bật: '+(adv.length?adv.join(', '):'chưa có')+(sug.rep.length?'. Từ lặp: '+sug.rep.map(r=>r.w+' ('+r.c+'x)').join(', '):'');
  let g=e===0?(complex>=1?3:2.5):e<=2?2:e<=4?1.5:1;
  if(n<L[0]*0.5)g=Math.min(g,2);
  const gc=e+' lỗi phát hiện được, '+complex+' câu phức. Máy chỉ bắt được lỗi quen thuộc.';
  let p=null,pc='Không đo được vì em gõ bài (không thu âm).';
  if(cs!==null){p=cs>=0.9?2:cs>=0.8?1.5:cs>=0.7?1:0.5;pc='Máy nghe hiểu '+Math.round(cs*100)+'% (càng cao càng rõ). Đây là ước lượng phát âm, không phải điểm giám khảo.'}
  const base=c+v+g+(p===null?0:p);
  const tot=Math.round((p===null?base*10/8:base)*10)/10;
  const lows=[];if(conf)chunks.forEach((s,i)=>{if(conf[i]!==undefined&&conf[i]<0.8)lows.push(s)});
  const tips=[];
  if(n<L[0])tips.push('Bài còn ngắn ('+n+' từ). Thêm một lý do bằng because và một ví dụ bằng For example.');
  if(n>L[1])tips.push('Bài hơi dài ('+n+' từ). Giữ ý chính, bỏ chi tiết phụ.');
  if(!reason)tips.push('Thêm ví dụ cụ thể: For example, last weekend I…');
  if(conn.length<2)tips.push('Dùng ít nhất hai từ nối: First of all, Besides, However, As a result.');
  if(e)tips.push('Sửa các lỗi ngữ pháp ở phần bên dưới rồi nói lại cả bài.');
  if(sug.rep.length)tips.push('Thay từ lặp bằng từ đồng nghĩa hoặc đại từ (xem bảng gợi ý).');
  if(lows.length)tips.push('Nghe mẫu rồi đọc theo các đoạn máy nghe chưa rõ: nhấn trọng âm, phát âm rõ âm cuối (s, t, d).');
  if(wpm!==null&&wpm<70)tips.push('Nói còn ngắt quãng. Hãy học thuộc khung ý rồi nói liền mạch, dùng Well… để câu giờ.');
  if(wpm!==null&&wpm>170)tips.push('Em nói hơi nhanh. Chậm lại để rõ từng từ.');
  return{id:id,n:n,tot:tot,c:c,v:v,g:g,p:p,cc:cc.join('. '),vc:vc,gc:gc,pc:pc,sug:sug,lows:lows,tips:tips,fixedText:chunks.map(s=>fixSent(s,true).fixed).join(' ')};
}
function spRender(r){
  const f=x=>String(x).replace('.',','),H=SPH[r.id]=(SPH[r.id]||[]).concat([r.tot]);
  const row=(a,b,mx,c)=>'<tr><td>'+a+'</td><td>'+(b===null?'–':f(b)+' / '+mx)+'</td><td>'+esc(c)+'</td></tr>';
  let h='<div class="card" style="margin-top:12px"><div class="stat">Điểm dự kiến lần '+H.length+' (tham khảo)</div><div class="big">'+f(r.tot)+' / 10</div>';
  if(H.length>1)h+='<p class="stat">Các lần trước: '+H.map(x=>f(x)).join(' → ')+(H[H.length-1]>H[H.length-2]?'. Tiến bộ rồi!':'')+'</p>';
  h+='<div class="tbl"><table><tr><th>Tiêu chí</th><th>Điểm</th><th>Căn cứ</th></tr>'+row('Nội dung và mạch lạc',r.c,3,r.cc)+row('Từ vựng',r.v,2,r.vc)+row('Ngữ pháp',r.g,3,r.gc)+row('Phát âm (ước lượng)',r.p,2,r.pc)+'</table></div><p class="stat">Máy chấm bằng từ khóa và quy tắc nên chỉ là ước lượng, có thể lệch 1–2 điểm. Điểm chính thức do giám khảo hoặc giáo viên chấm.</p></div>';
  h+='<div class="card" style="margin-top:12px"><b>Bài em vừa nói (máy nghe được)</b><p class="para">'+esc(SPH['t'+r.id]||'')+'</p></div>';
  if(r.sug.fixes.length)h+='<div class="card" style="margin-top:12px"><b>Sửa lỗi: câu nên nói lại</b>'+r.sug.fixes.map(x=>'<div style="margin:10px 0;padding-top:8px;border-top:1px solid var(--line)"><div class="stat">Đoạn '+x.no+'</div><div class="bad-t">'+esc(x.orig)+'</div><div class="ok-t"><b>'+esc(x.fixed)+'</b></div><ul>'+x.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>').join('')+'<div class="row"><button class="btn" data-sp="fixplay" data-id="'+r.id+'">Nghe bản đã sửa</button></div></div>';
  else h+='<div class="card" style="margin-top:12px"><p class="ok-t">Máy không phát hiện lỗi ngữ pháp quen thuộc nào.</p></div>';
  if(r.lows.length)h+='<div class="card" style="margin-top:12px"><b>Đoạn máy nghe chưa rõ (nên luyện phát âm)</b><ul>'+r.lows.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="stat">Cách luyện: nghe bài mẫu từng câu (bấm vào câu), đọc theo thật chậm, rồi tăng tốc. Chú ý âm cuối và trọng âm.</p></div>';
  if(r.sug.rep.length)h+='<div class="card" style="margin-top:12px"><b>Gợi ý tránh lặp từ</b><div class="tbl"><table><tr><th>Từ lặp</th><th>Số lần</th><th>Thay bằng</th></tr>'+r.sug.rep.map(x=>'<tr><td><b>'+esc(x.w)+'</b></td><td>'+x.c+'</td><td>'+(x.syn.length?esc(x.syn.join(' / ')):'dùng đại từ hoặc nói lại cách khác')+'</td></tr>').join('')+'</table></div></div>';
  if(r.sug.weak.length||r.sug.missing.length)h+='<div class="card" style="margin-top:12px"><b>Nâng cấp bài nói</b><ul>'+r.sug.weak.map(x=>'<li>'+esc(x)+'</li>').join('')+(r.sug.missing.length?'<li>Từ hay trong bài mẫu em có thể dùng: '+esc(r.sug.missing.join(', '))+'</li>':'')+'</ul></div>';
  h+='<div class="card hl" style="margin-top:12px"><b>Hướng dẫn nói lại</b>'+(r.tips.length?'<ol>'+r.tips.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'<p>Bài nói khá tốt. Hãy thử nói lại thật trôi chảy, không nhìn bài mẫu.</p>')+'<div class="row"><button class="btn pri" data-sp="again" data-id="'+r.id+'">Nói lại</button></div></div>';
  return h;
}
function spShow(id,chunks,conf,secs){
  const text=chunks.join(' ').trim(),out=document.getElementById('res-'+id);if(!out)return;
  if(wc(text)<3){out.innerHTML='<p class="bad-t">Máy chưa nghe được gì. Hãy kiểm tra micro, nói to và rõ hơn, rồi thử lại, hoặc gõ bài nói vào ô bên dưới.</p>';return}
  SPH['t'+id]=text;SPH['f'+id]=null;
  const r=spGrade(id,chunks,conf,secs);SPH['f'+id]=r.fixedText;
  out.innerHTML=spRender(r);
  try{out.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
}
function spRecStart(id){
  const live=document.getElementById('live-'+id);
  if(!SPSR){live.innerHTML='<span class="bad-t">Trình duyệt này chưa hỗ trợ thu âm nhận dạng. Hãy dùng Chrome hoặc Edge, hoặc gõ bài nói vào ô bên dưới.</span>';return}
  if(SPREC)spRecAbort();
  spStop();
  const rec=new SPSR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  const S={id:id,rec:rec,chunks:[],conf:[],interim:'',t0:Date.now(),stopping:false,err:null};SPREC=S;
  rec.onresult=e=>{
    let it='';
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){const t=r[0].transcript.trim();if(t){S.chunks.push(t);S.conf.push(r[0].confidence||0)}}else it+=r[0].transcript}
    S.interim=it;live.innerHTML='<b>Đang nghe…</b> '+esc(S.chunks.join(' ')+' '+it);
  };
  rec.onerror=e=>{S.err=e.error;if(e.error==='not-allowed'||e.error==='service-not-allowed')live.innerHTML='<span class="bad-t">Trình duyệt chưa được phép dùng micro. Bấm biểu tượng ổ khóa cạnh địa chỉ trang và cho phép micro.</span>'};
  rec.onend=()=>{
    if(!S.stopping&&!S.err){try{rec.start();return}catch(e){}}
    if(SPREC===S)SPREC=null;
    $('[data-sp=rec][data-id="'+id+'"]').disabled=false;const sb=$('[data-sp=recstop][data-id="'+id+'"]');if(sb)sb.disabled=true;
    if(S.stopping){if(S.interim){S.chunks.push(S.interim.trim());S.conf.push(0.8)}live.textContent='';spShow(id,S.chunks,S.conf,(Date.now()-S.t0)/1000)}
  };
  $('[data-sp=rec][data-id="'+id+'"]').disabled=true;$('[data-sp=recstop][data-id="'+id+'"]').disabled=false;
  $('#res-'+id).innerHTML='';live.innerHTML='<b>Đang nghe…</b> hãy nói, rồi bấm Dừng và chấm điểm.';
  try{rec.start()}catch(e){live.innerHTML='<span class="bad-t">Chưa bật được micro. Hãy thử lại.</span>';$('[data-sp=rec][data-id="'+id+'"]').disabled=false}
}
function spRecAbort(){if(SPREC){SPREC.stopping=false;SPREC.err='abort';try{SPREC.rec.abort()}catch(e){}SPREC=null}}
function spRecStop(id){if(SPREC&&SPREC.id===id){SPREC.stopping=true;try{SPREC.rec.stop()}catch(e){}}}

function spBeep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
function spTimer(sec,label){

const gradeText=(q,v)=>q.a.some(a=>norm(a)===norm(v));

function fbHTML(q,ok,v){
  const unans=(v===undefined||v===null||v==='')&&!ok;
  return '<div class="fb '+(ok?'ok':'bad')+'"><b class="k">'+(ok?'Đúng.':unans?'Chưa trả lời.':'Chưa đúng.')+'</b>'+(ok?'':' Đáp án: '+ansHTML(q)+'.')+(q.e?' '+q.e:'')+'</div>';
}
function record(key,ok,v){ST.res[key]={ok,v};save();updateBadge()}
function updateBadge(){

}
const scoreOf=s=>{const ks=keysOf(s);let a=0,c=0;ks.forEach(k=>{const r=ST.res[k];if(r){a++;if(r.ok)c++}});return{n:ks.length,a,c}};
function scoreTxt(s){const x=scoreOf(s);return x.c+'/'+x.n+' đúng'+(x.a<x.n?' · đã làm '+x.a:'')}
function updScore(setId){
  const s=SETS.find(x=>x.id===setId),el=$('#sc-'+setId);if(!s||!el)return;

function qHTML(key,no,o){
  o=o||{};const q=QI[key];const mode=o.mode||'live';
  const st=o.st!==undefined?o.st:(o.fresh||mode==='exam'?null:ST.res[key]);
  const locked=!!st;const sel=mode==='exam'&&o.v!==undefined?o.v:undefined;
  let h='<div class="q" data-key="'+key+'" data-k="'+q.k+'">';

    h+='<div class="p"><span class="no">'+no+'.</span><div class="t">'+q.q+'</div></div><div class="opts">';
    q.o.forEach((t,i)=>{
      let c='opt';
      if(locked){if(i===q.a)c+=' ok';else if(st.v===i)c+=' bad'}
      else if(sel===i)c+=' sel';
      h+='<button class="'+c+'" data-i="'+i+'"'+(locked?' disabled':'')+'><span class="l">'+LET[i]+'</span><span>'+t+'</span></button>';
    });
    h+='</div>';
  }else{
    const val=locked&&st.v!==undefined?esc(st.v):(sel!==undefined?esc(sel):'');
    const cls='fi'+(locked?(st.ok?' ok':' bad'):'');
    const inp='<input class="'+cls+'" type="text" id="f-'+mode+'-'+key.replace('.','-')+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu '+no+'" size="'+Math.max(9,String(q.a[0]).length+4)+'" value="'+val+'"'+(locked?' disabled':'')+'>';
    const btn=(mode==='exam'||locked)?'':'<button class="btn sm chk">Kiểm tra</button>';
    if(q.k==='fill'&&q.q.indexOf('___')>=0){
      h+='<div class="p"><span class="no">'+no+'.</span><div class="t">'+q.q.replace('___',inp)+(q.h?' <span class="hint">'+q.h+'</span>':'')+'</div></div>';
      if(btn)h+='<div class="fline">'+btn+'</div>';
    }else{
      h+='<div class="p"><span class="no">'+no+'.</span><div class="t">'+q.q+(q.h?' <span class="hint">'+q.h+'</span>':'')+'</div></div><div class="fline">'+(q.k==='fix'?'<span class="hint">Viết lại cụm in đậm:</span>':'')+inp+btn+'</div>';
    }
  }
  h+='<div class="fbx">'+(locked&&mode!=='exam'?fbHTML(q,st.ok,st.v):'')+'</div></div>';
  return h;
}
function sortRowHTML(key,s,i,o){
  const it=s.items[i],st=ST.res[key];

function clozeHTML(s){
  let txt=esc(s.text);

function setHTML(s){

    if((m=s.match(/\b(enjoy|enjoys)\s+to\s+\w+|\b(like|likes|love|loves|enjoy|enjoys|hate|hates)\s+(play|do|go|read|watch|listen|spend|swim|cook|walk|run|talk|learn)\b/i)))add('«'+m[0]+'»: sau enjoy dùng V-ing; sau like/love nên dùng V-ing hoặc to V.');
    if((m=s.match(/\b(advices|informations|furnitures|homeworks|knowledges|peoples|childs|womans|mans|scenerys|musics)\b/i)))add('«'+m[0]+'»: sai dạng số (advice, information, furniture, homework, knowledge, scenery, music không thêm s; people, children, women, men là dạng đúng).');
    if((m=s.match(/\bvery\s+(wonderful|delicious|excellent|amazing|terrible|fantastic)\b/i)))add('«'+m[0]+'»: không dùng very với tính từ đã mang nghĩa rất mạnh.');
    if(/\bfunny activities\b/i.test(s))add('«funny activities»: funny là hài hước; hoạt động thú vị nên dùng enjoyable / interesting.');
    if(/\bin here\b/i.test(s))add('«in here»: thường viết là here / in this place.');
    if((m=s.match(/\b(people|teenagers|students|children|friends|parents)\s+is\b/i)))add('«'+m[0]+'»: chủ ngữ số nhiều dùng are.');
    if(/\bthe life\b/i.test(s))add('«the life»: nghĩa chung chung dùng life, không dùng the.');
    if((m=s.match(/\bmore\s+(better|easier|bigger|cheaper|healthier)\b/i)))add('«'+m[0]+'»: so sánh hơn không dùng more với tính từ ngắn đã có -er.');
    if((m=s.match(/\b(dont|cant|doesnt|isnt|wont|didnt|arent)\b/i)))add('«'+m[0]+'»: thiếu dấu nháy (don\'t, can\'t, doesn\'t...).');
    if(/(^|\s)i(\s|$)/.test(s))add('đại từ I phải viết hoa.');
    if((m=s.match(/\b(\w+)\s+\1\b/i))&&!/^(very|that|had)$/i.test(m[1]))add('«'+m[0]+'»: lặp từ liền nhau.');
    const rx=/\ba\s+([aeiou]\w*)/ig;while((m=rx.exec(s))){if(!/^(uni|use|usu|eur|one|once|util|ubi)/i.test(m[1]))add('«a '+m[1]+'»: từ bắt đầu bằng nguyên âm dùng an.')}
    const ry=/\ban\s+([^aeiou\s]\w*)/ig;while((m=ry.exec(s))){if(!/^(hour|honest|heir|honou?r|mp3)/i.test(m[1]))add('«an '+m[1]+'»: từ bắt đầu bằng phụ âm dùng a.')}

  });
  return out;
}

function initWR(){
  /* đoạn mẫu 1 */
  const para=$('#para'),info=$('#info');let cur=null;
  P.forEach(p=>{
    if(typeof p==='string'){para.appendChild(document.createTextNode(p));return}

  });
  const hideB=$('#hideB');
  hideB.onclick=()=>{const on=hideB.getAttribute('aria-pressed')!=='true';hideB.setAttribute('aria-pressed',on);para.classList.toggle('hide',on);if(on)$$('.k',para).forEach(x=>x.classList.remove('shown'))};
  $('#revB').onclick=()=>$$('.k',para).forEach(x=>x.classList.add('shown'));
  const m2B=$('#m2B');
  const msel=$('#msel');

  msel.onchange=showM;showM();
  m2B.onclick=()=>{const on=m2B.getAttribute('aria-pressed')!=='true';m2B.setAttribute('aria-pressed',on);$('#m2').style.display=on?'none':'';m2B.textContent=on?'Hiện đoạn mẫu':'Ẩn đoạn (tự viết trước)'};
  /* tự viết */
  const ta=$('#ta'),topic=$('#topic');
  const load_=()=>{ta.value=(ST.draft&&ST.draft[topic.value])||'';upd()};
  function upd(){
    const t=ta.value,n=wc(t);$('#cnt').textContent=n;
    const st=$('#st');
    if(!n){st.textContent='';st.className=''}
    else if(n<120){st.textContent='(cần thêm '+(120-n)+' từ)';st.className='bad-t'}
    else if(n<=150){st.textContent='(đạt 120–150 ✓)';st.className='ok-t'}
    else{st.textContent='(thừa '+(n-150)+' từ, cần cắt)';st.className='bad-t'}
    const sl=sentsOf(t);const sents=sl.length;$('#sc').textContent=sents;
    const f=$('#fill');f.style.width=Math.min(100,n/180*100)+'%';f.className='fill '+(n>150?'over':n>=120?'good':'short');
    const lg=sl.map((x,i)=>[i+1,wc(x)]).filter(x=>x[1]>16);
    const qe=n?quickErrors(t):[];
    $('#quick').innerHTML=n?'<p class="stat" style="margin:8px 0 4px"><b>Kiểm tra lỗi phổ biến (tự động, có thể sót hoặc nhầm):</b></p>'+(qe.length?'<ul>'+qe.slice(0,12).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+(qe.length>12?'<p class="stat">…và '+(qe.length-12)+' lỗi nữa.</p>':''):'<p class="ok-t">Chưa phát hiện lỗi phổ biến nào.</p>'):'';
    $('#longs').innerHTML=(n&&sents>12?'<span class="bad-t">Đã viết '+sents+' câu, chỉ nên 12 câu. </span>':'')+(lg.length?'Câu quá dài (trên 16 từ): '+lg.map(x=>'câu '+x[0]+' ('+x[1]+' từ)').join(', ')+'. Hãy cắt ngắn.':'');
    const has=r=>r.test(t);
    const items=[
      [n>=120&&n<=150,'Độ dài 120–150 từ'],
      [!/\n/.test(t.trim())&&n>0,'Viết liền một khối, không xuống dòng'],
      [sents>=10&&sents<=14,'Khoảng 12 câu (10–14 câu)'],
      [has(/\b(firstly|first of all)\b/i)&&has(/\bsecondly\b/i)&&has(/\b(thirdly|finally)\b/i),'Có Firstly, Secondly, Thirdly/Finally'],
      [(t.match(/for example|for instance|such as/gi)||[]).length>=2,'Có ít nhất 2 ví dụ (For example, For instance)'],
      [has(/in conclusion|to sum up|in short|therefore/i),'Có câu kết (In conclusion, To sum up...)'],
      [!/very wonderful|funny activities|\bin here\b/i.test(t)&&n>0,'Không dùng very wonderful, funny activities, in here']
    ];
    $('#auto').innerHTML=items.map(i=>'<li>'+(i[0]?'<span class="ok-t">✓</span>':'<span class="bad-t">○</span>')+' '+i[1]+'</li>').join('');
  }
  ta.addEventListener('input',()=>{ST.draft=ST.draft||{};ST.draft[topic.value]=ta.value;save();upd()});
  topic.addEventListener('change',()=>{$('#topicNote').textContent=WR_TOPICS[topic.value][1];load_()});
  load_();
  aiInit(ta,topic);
  /* viết từng câu */
  const bi=$$('.bi');
  function bUpd(){
    let tot=0;
    bi.forEach((el,i)=>{
      const n=wc(el.value),b=BUD[i];tot+=n;const c=$('#bc'+i);
      c.textContent=n+' từ · cần '+b[2]+'–'+b[3]+(n&&n<b[2]?' (thêm '+(b[2]-n)+')':n>b[3]?' (bớt '+(n-b[3])+')':n?' ✓':'');
      c.className='bc stat '+(n===0?'':n>b[3]?'bad-t':n<b[2]?'low-t':'ok-t');
    });
    $('#btot').textContent=tot;
    const f=$('#bfill');f.style.width=Math.min(100,tot/180*100)+'%';f.className='fill '+(tot>150?'over':tot>=120?'good':'short');
    $('#bmsg').textContent=tot===0?'':tot<120?'Còn thiếu '+(120-tot)+' từ.':tot<=150?'Đạt 120–150 từ.':'Thừa '+(tot-150)+' từ, hãy cắt các câu đang đỏ.';
  }
  const bd=(ST.draft&&ST.draft.b)||[];
  bi.forEach((el,i)=>{el.value=bd[i]||'';el.addEventListener('input',()=>{ST.draft=ST.draft||{};ST.draft.b=bi.map(x=>x.value);save();bUpd()})});
  bUpd();
  const joined=()=>bi.map(x=>x.value.trim().replace(/\s+/g,' ')).filter(Boolean).join(' ');
  $('#bJoin').onclick=()=>{const j=joined();$('#bOut').textContent=j?j+'\n\n('+wc(j)+' từ)':'Chưa có câu nào.'};
  $('#bCopy').onclick=()=>{const j=joined();if(!j)return;ta.value=j;ST.draft=ST.draft||{};ST.draft[topic.value]=j;save();upd();ta.scrollIntoView({block:'center'})};
  $('#bClr').onclick=()=>{bi.forEach(x=>x.value='');ST.draft=ST.draft||{};ST.draft.b=[];save();bUpd();$('#bOut').textContent=''};
  /* checklist */
  const box=$('#chk');
  CHK.forEach((t,i)=>{
    const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!(ST.chk&&ST.chk[i]);
    c.onchange=()=>{ST.chk=ST.chk||{};ST.chk[i]=c.checked;save();prog()};
    l.appendChild(c);const s=document.createElement('span');s.textContent=t;l.appendChild(s);box.appendChild(l);
  });
  function prog(){$('#prog').textContent='Đã soát '+$$('input:checked',box).length+' / '+CHK.length+' mục'}
  prog();
  /* máy tính điểm */
  const ids=['c1','c2','c3','c4','c5','c6','c7'];
  const calc=()=>{
    const v=ids.map(i=>parseFloat($('#'+i).value)||0);
    const raw=Math.min(3,v[0])+Math.min(4,v[1])+Math.min(2,v[2])+Math.min(1,v[3])-v[4]*1-v[5]*0.5-v[6]*2;
    $('#calcOut').textContent=Math.max(0,Math.round(raw*10)/10).toString().replace('.',',');
  };
  ids.forEach(i=>$('#'+i).addEventListener('input',calc));calc();
}

function renderGrade(d,text){
  const C=d.criteria||{},L=aiLen();

  const tot=Object.keys(AIR).reduce((a,k)=>a+sc(k),0);
  const er=Array.isArray(d.errors)?d.errors:[];

  if(d.rewrite)h+='<div class="card" style="margin-top:12px"><b>Đoạn viết lại tham khảo ('+wc(d.rewrite)+' từ)</b><p class="para">'+esc(d.rewrite)+'</p></div>';

  $('#aiOut').innerHTML=h;
}

/* ----- Chấm nhanh trên máy (không cần mạng) ----- */
const LG_STOP=new Set('the a an and or but of to in on at for with by from as is are was were be been it its this that these those they them their we our you your i my he she his her not no do does did have has had can could will would should may might very more most so than then there here about into over after before when while if because also just all any some many much lot lots people'.split(' '));
const LG_CONN=['first','firstly','first of all','second','secondly','third','thirdly','finally','moreover','in addition','besides','furthermore','however','therefore','as a result','in conclusion','to sum up','overall','in short','for example','for instance','such as','because','so','but','although','while','whenever','not only'];
const LG_ADV='relieve boost improve develop enhance valuable enjoyable beneficial crucial significant communicate communication confident confidence essential benefit strengthen reduce stress healthy mental physical social skills teamwork cooperate support encourage achieve balance opportunity experience tradition peaceful convenient facilities entertainment independent responsible pressure expectation'.split(' ');
const LG_TYPO=/\b(recieve|definately|freind|freinds|beleive|wich|becuase|enviroment|importent|healty|comunicate|comunication|activitys|tomorow|diffrent|intresting|interesing|wonderfull|beautifull|alot|exsample|exemple|frist|thirdly?y|studing|writting|happpy|teanagers|teeenagers)\b/ig;
function localGrade(text,topic,L){
  const n=wc(text),S=sentsOf(text),low=text.toLowerCase();
  const words=low.match(/[a-z']+/g)||[];
  const qe=quickErrors(text);
  const typos=[...new Set((text.match(LG_TYPO)||[]).map(x=>x.toLowerCase()))];
  const conn=[...new Set(LG_CONN.filter(c=>new RegExp('(^|[^a-z])'+c+'([^a-z]|$)').test(low)))];
  const ex=(low.match(/for example|for instance|such as/g)||[]).length;
  const concl=/in conclusion|to sum up|overall|in short|therefore|to conclude/.test(low);
  const order=/(first|firstly)/.test(low)&&/(second|secondly|third|thirdly|finally|besides|moreover)/.test(low);
  const complex=S.filter(s=>/\b(because|when|if|although|while|which|who|whenever|so that|where)\b/i.test(s)).length;
  const freq={};words.forEach(w=>{if(w.length>3&&!LG_STOP.has(w))freq[w]=(freq[w]||0)+1});
  const reps=Object.keys(freq).filter(w=>freq[w]>=4);
  const adv=[...new Set(words.filter(w=>LG_ADV.includes(w)))];
  const key=topic.toLowerCase().match(/[a-z]{4,}/g)||[];
  const onTopic=!key.length||key.some(k=>low.includes(k.slice(0,Math.max(4,k.length-2))));
  const lenOK=n>=L.lo&&n<=L.hi;
  const C={},cm={};
  // content
  let c=lenOK&&ex>=2?2:(ex>=1||lenOK)?1.5:(n<L.lo*0.6?0.5:1);
  if(!onTopic)c=Math.min(c,1);
  C.content=c;cm.content=(onTopic?'':'Chưa thấy từ khóa của đề, có thể lạc ý. ')+'Ví dụ cụ thể: '+ex+(ex>=2?' (tốt).':' (nên có ít nhất 2: For example / For instance).')+(lenOK?'':' Độ dài chưa đạt.');
  // structure
  let st=(concl&&order&&conn.length>=5)?2:(concl&&conn.length>=3)?1.5:(conn.length>=1)?1:0.5;
  C.structure=st;cm.structure='Từ nối tìm thấy: '+(conn.length?conn.join(', '):'không có')+'. '+(order?'Có thứ tự ý (First… Second/Finally). ':'Thiếu thứ tự ý First… Second… Finally. ')+(concl?'Có câu kết.':'Thiếu câu kết (In conclusion…).');
  // vocab
  let v=(adv.length>=4&&reps.length<=1)?2:(adv.length>=2||reps.length<=1)?1.5:1;
  C.vocab=v;cm.vocab='Từ vựng nổi bật: '+(adv.length?adv.join(', '):'chưa có')+'. '+(reps.length?'Từ lặp nhiều: '+reps.map(w=>w+' ('+freq[w]+'x)').join(', ')+'.':'Ít lặp từ.');
  // grammar
  const e=qe.length;
  let g=(e===0&&complex>=3)?3:(e<=2&&complex>=2)?2:(e<=5)?1:0.5;
  if(e===0&&complex<3)g=2;
  C.grammar=g;cm.grammar=e+' lỗi phát hiện được, '+complex+' câu phức. (Máy chỉ bắt được một phần lỗi, ngữ pháp cần người đọc lại.)';
  // spelling
  const sp=typos.length+qe.filter(x=>/viết hoa|nháy|dấu chấm/.test(x)).length;
  C.spelling=sp===0?1:sp<=2?0.5:0;cm.spelling=sp?sp+' lỗi chính tả / dấu câu.':'Chưa thấy lỗi chính tả rõ ràng.';
  const tips=[];
  if(!lenOK)tips.push(n<L.lo?'Còn thiếu '+(L.lo-n)+' từ, hãy thêm ví dụ.':'Thừa '+(n-L.hi)+' từ, hãy cắt các câu dài.');
  if(ex<2)tips.push('Thêm ví dụ cụ thể bằng For example / For instance.');
  if(!concl)tips.push('Kết bằng In conclusion hoặc Therefore.');
  if(!order)tips.push('Dùng First… Second… Finally để sắp xếp ý.');
  if(reps.length)tips.push('Thay từ lặp bằng từ đồng nghĩa: '+reps.join(', ')+'.');
  if(complex<3)tips.push('Thêm câu phức với because, when, if, although, which.');
  return{C,cm,qe,typos,n,tips,tot:Object.keys(C).reduce((a,k)=>a+C[k],0)};
}
function lgRun(topic){
