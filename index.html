const SYN={friends:['companions','classmates','peers','close ones','them (đại từ)'],friend:['companion','classmate','peer'],time:['moments','hours','period','free hours','it (đại từ)'],help:['support','assist','benefit','contribute to'],helps:['supports','assists','benefits'],good:['beneficial','positive','useful','excellent'],important:['essential','crucial','vital','significant'],like:['enjoy','be fond of','prefer','love'],people:['teenagers','students','individuals','young people'],activities:['hobbies','pastimes','pursuits'],activity:['hobby','pastime'],feel:['experience','sense','become'],make:['let','allow','enable','cause'],many:['numerous','plenty of','various','a variety of'],happy:['delighted','cheerful','content','joyful'],learn:['acquire','pick up','develop','gain'],get:['gain','receive','obtain','earn'],spend:['devote','dedicate','invest'],play:['take part in','join in','practise'],stress:['pressure','tension','worries'],study:['learn','revise','work on'],lesson:['class','subject'],lessons:['classes','subjects'],school:['class','campus'],family:['relatives','parents','loved ones'],life:['daily routine','everyday life','lifestyle'],skills:['abilities','competences','talents'],improve:['enhance','develop','boost','strengthen'],enjoy:['love','take pleasure in','be keen on'],use:['apply','employ','make use of'],'things':['activities','habits','aspects'],thing:['aspect','point','matter'],relax:['unwind','refresh themselves','recharge'],healthy:['good for health','beneficial','nutritious (đồ ăn)'],together:['with one another','side by side','as a group'],country:['rural area','village','countryside'],countryside:['rural area','village','the country']};
const WEAK=[[/\ba lot of\b/i,'a lot of → numerous / plenty of / a great deal of'],[/\blots of\b/i,'lots of → numerous / plenty of'],[/\bvery good\b/i,'very good → excellent / beneficial / outstanding'],[/\bvery important\b/i,'very important → essential / crucial'],[/\bvery happy\b/i,'very happy → delighted / thrilled'],[/\bvery big\b/i,'very big → huge / enormous'],[/\bvery tired\b/i,'very tired → exhausted'],[/\bnice\b/i,'nice → pleasant / friendly / enjoyable'],[/\bthings?\b/i,'thing(s) → nói cụ thể: activities, habits, hobbies…'],[/\bgood\b/i,'good → beneficial / positive / useful'],[/\bbad\b/i,'bad → harmful / negative / unhealthy'],[/\bget\b/i,'get → gain / receive / obtain / become'],[/\bbig\b/i,'big → large / significant / major'],[/\bI think\b/i,'I think → In my opinion / From my point of view']];
function fixSent(s,sp){
  let f=s;const notes=[];
  const R=(re,fn,why)=>{f=f.replace(re,(...a)=>{const r=typeof fn==='string'?fn:fn(...a);if(r!==a[0])notes.push(why+': «'+a[0].trim()+'» → «'+r.trim()+'»');return r})};
  const sv=w=>/(s|x|z|ch|sh)$/.test(w)?w+'es':/[^aeiou]y$/.test(w)?w.slice(0,-1)+'ies':w==='have'?'has':w==='do'?'does':w==='go'?'goes':w+'s';
  const un=w=>w==='has'?'have':w==='does'?'do':w==='goes'?'go':/ies$/.test(w)?w.slice(0,-3)+'y':/(ches|shes|sses|xes|zes)$/.test(w)?w.slice(0,-2):w.slice(0,-1);
  R(/\b(he|she|it)\s+(help|make|give|take|feel|get|need|want|like|love|enjoy|learn|teach|improve|keep|bring|show|play|have|do|go|become|allow)\b/ig,(m,a,v)=>a+' '+sv(v.toLowerCase()),'Chủ ngữ số ít thêm s/es');
  R(/\b(they|we|you|teenagers|students|children|friends|parents|kids)\s+(helps|makes|gives|takes|feels|gets|needs|wants|likes|loves|enjoys|learns|teaches|improves|keeps|brings|shows|plays|has|does|goes|becomes|allows)\b/ig,(m,a,v,o)=>/\b(with|of|for|to|and|from|about|by|in|on)\s*$/i.test(f.slice(0,o))?m:a+' '+un(v.toLowerCase()),'Chủ ngữ số nhiều bỏ s');
  R(/\b(people|teenagers|students|children|friends|parents)\s+is\b/ig,(m,a)=>a+' are','Chủ ngữ số nhiều dùng are');
  R(/\b(make|makes|made|let|lets)\s+(us|them|him|her|me|you|students|teenagers|children|people|friends)\s+to\s+/ig,(m,a,b)=>a+' '+b+' ','make/let + người + V (bỏ to)');
  R(/\b(enjoy|enjoys)\s+to\s+(\w+)/ig,(m,a,v)=>a+' '+(v.replace(/e$/,'')+'ing'),'enjoy + V-ing');
  R(/\b(advice|information|furniture|homework|knowledge|scenery|music)s\b/ig,(m,a)=>a,'Danh từ không đếm được, không thêm s');
  R(/\bvery\s+(wonderful|delicious|excellent|amazing|terrible|fantastic)\b/ig,(m,a)=>a,'Bỏ very');
  R(/\bthe life\b/ig,'life','Bỏ the trước life (nghĩa chung)');
  R(/\bmore\s+(better|easier|bigger|cheaper|healthier)\b/ig,(m,a)=>a,'Bỏ more');
  R(/\b(dont|cant|doesnt|isnt|wont|didnt|arent)\b/ig,m=>({dont:"don't",cant:"can't",doesnt:"doesn't",isnt:"isn't",wont:"won't",didnt:"didn't",arent:"aren't"})[m.toLowerCase()],'Thêm dấu nháy');
  R(/\bi\b(?!')/g,'I','Viết hoa I');
  R(/\ba\s+([aeiou]\w*)/ig,(m,w)=>/^(uni|use|usu|eur|one|once|util|ubi)/i.test(w)?m:'an '+w,'a → an trước nguyên âm');
  R(/\ban\s+([^aeiou\s]\w*)/ig,(m,w)=>/^(hour|honest|heir|honou?r|mp3)/i.test(w)?m:'a '+w,'an → a trước phụ âm');
  R(/\b(people|teenagers|students|children|friends|parents)\s+(is|was)\b/ig,(m,a,b)=>a+(b==='is'?' are':' were'),'Chủ ngữ số nhiều');
  R(/\b(\w+)\s+\1\b/ig,(m,w)=>/^(very|that|had)$/i.test(w)?m:w,'Bỏ từ lặp liền nhau');
  if(!sp){if(/^[a-z]/.test(f)){f=f[0].toUpperCase()+f.slice(1);notes.push('Viết hoa chữ cái đầu câu')}
  if(!/[.!?]$/.test(f)){f+='.';notes.push('Thêm dấu chấm cuối câu')}}
  return{fixed:f,notes};
}
function lgSuggest(text){
  const S=sentsOf(text),low=text.toLowerCase(),out={fixes:[],rep:[],weak:[],starts:[],long:[]};
  S.forEach((s,i)=>{const r=fixSent(s);if(r.notes.length)out.fixes.push({no:i+1,orig:s,fixed:r.fixed,notes:r.notes});
    if(wc(s)>20)out.long.push({no:i+1,n:wc(s),s:s});
    WEAK.forEach(w=>{if(w[0].test(s))out.weak.push('Câu '+(i+1)+': '+w[1])})});
  const words=low.match(/[a-z']+/g)||[],freq={};
  words.forEach(w=>{if(w.length>3&&!LG_STOP.has(w))freq[w]=(freq[w]||0)+1});
  Object.keys(freq).filter(w=>freq[w]>=3).sort((a,b)=>freq[b]-freq[a]).slice(0,6).forEach(w=>{
    const where=S.map((s,i)=>new RegExp('\\b'+w+'\\b','i').test(s)?i+1:0).filter(Boolean);
    out.rep.push({w:w,c:freq[w],where:where,syn:SYN[w]||SYN[w.replace(/s$/,'')]||[]})});
  const firsts=S.map(s=>(s.toLowerCase().match(/[a-z']+/)||[''])[0]),cnt={};
  firsts.forEach(w=>{cnt[w]=(cnt[w]||0)+1});
  Object.keys(cnt).filter(w=>cnt[w]>=3&&!['first','second','third'].includes(w)).forEach(w=>out.starts.push('Có '+cnt[w]+' câu bắt đầu bằng «'+w+'». Hãy đổi: dùng trạng từ (Moreover, In addition), cụm giới từ (At school, In my experience) hoặc mệnh đề (When…, Because…).'));
  return out;
}
function lgSuggestHTML(text){
  const g=lgSuggest(text);let h='';
  if(g.fixes.length){
    h+='<div class="card" style="margin-top:12px"><b>Sửa lỗi: câu sau khi sửa</b>'+g.fixes.map(x=>'<div style="margin:10px 0;padding-top:8px;border-top:1px solid var(--line)"><div class="stat">Câu '+x.no+'</div><div class="bad-t">'+esc(x.orig)+'</div><div class="ok-t"><b>'+esc(x.fixed)+'</b></div><ul>'+x.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>').join('')+'</div>';
  }
  if(g.rep.length){
    h+='<div class="card" style="margin-top:12px"><b>Gợi ý tránh lặp từ</b><p class="stat">Cách làm: (1) thay bằng đại từ they / them / it; (2) dùng từ đồng nghĩa; (3) gộp hai câu bằng which / who; (4) bỏ bớt, vì nhiều khi câu vẫn đủ nghĩa.</p><div class="tbl"><table><tr><th>Từ lặp</th><th>Số lần</th><th>Ở câu</th><th>Thay bằng</th></tr>'+g.rep.map(r=>'<tr><td><b>'+esc(r.w)+'</b></td><td>'+r.c+'</td><td>'+r.where.join(', ')+'</td><td>'+(r.syn.length?esc(r.syn.join(' / ')):'dùng đại từ hoặc viết lại câu')+'</td></tr>').join('')+'</table></div><p class="stat">Chỉ nên giữ từ khóa của đề (ví dụ friends, leisure) khoảng 3 lần, còn lại thay bằng cách trên.</p></div>';
  }
  if(g.long.length)h+='<div class="card" style="margin-top:12px"><b>Câu quá dài, nên tách</b><ul>'+g.long.map(x=>'<li>Câu '+x.no+' ('+x.n+' từ): '+esc(x.s)+'<br><span class="stat">Gợi ý: tách ở and / which / who thành hai câu ngắn, hoặc bỏ bớt cụm bổ nghĩa.</span></li>').join('')+'</ul></div>';
  if(g.starts.length)h+='<div class="card" style="margin-top:12px"><b>Câu bắt đầu giống nhau</b><ul>'+g.starts.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  if(g.weak.length)h+='<div class="card" style="margin-top:12px"><b>Nâng cấp từ vựng</b><ul>'+[...new Set(g.weak)].slice(0,10).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  if(g.fixes.length){
    const fx=sentsOf(text).map(s=>fixSent(s).fixed).join(' ');
    h+='<div class="card" style="margin-top:12px"><b>Đoạn văn sau khi sửa lỗi máy phát hiện được ('+wc(fx)+' từ)</b><p class="para">'+esc(fx)+'</p><p class="stat">Máy chỉ sửa được các lỗi quen thuộc. Em tự đọc lại một lần nữa.</p></div>';
  }
  if(!h)h='<p class="ok-t" style="margin-top:12px">Máy không có gợi ý sửa thêm. Hãy dùng bảng soát 10 điểm bên dưới để tự kiểm tra.</p>';
  return h;
}

/* ----- Đề thi thử ----- */
let EX=null,TM=null;
const PLANS={20:[['pa',3],['wf',5],['cd1',2],['cd2',2],['cd3',2],['cd4',2],['cd5',2],['cd6',2]],40:[['pa',6],['wf',10],['cd1',4],['cd2',4],['cd3',4],['cd4',4],['cd5',4],['cd6',4]]};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(n){
  if(n==='p2'){const ks=EXAM2.map((_,i)=>'e2.'+i);EX={keys:ks,ans:{},start:Date.now(),end:Date.now()+45*60000,mins:45,done:false,n:ks.length,paper:'p2'};runTimer();return}
  n=+n;const keys=[];
  PLANS[n].forEach(([sec,m])=>{
    const pool=Object.keys(QI).filter(k=>QI[k].sec===sec&&QI[k].src==='list'&&(QI[k].k==='mc'||QI[k].k==='fill'));
    keys.push(...shuffle(pool).slice(0,m));
  });
  const mins=n===20?25:50;
  EX={keys,ans:{},start:Date.now(),end:Date.now()+mins*60000,mins,done:false,n:keys.length};
  runTimer();
}
function runTimer(){
  clearInterval(TM);
  TM=setInterval(()=>{
    if(!EX||EX.done){clearInterval(TM);return}
    const left=Math.max(0,EX.end-Date.now()),el=$('#tm');
    if(el){el.textContent=fmt(left);el.classList.toggle('low',left<5*60000)}
    if(left<=0)submitExam();
  },1000);
}
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function examCount(){const el=$('#exCount');if(!el)return;const n=EX.keys.filter(k=>EX.ans[k]!==undefined&&String(EX.ans[k]).trim()!=='').length;el.textContent='Đã trả lời '+n+'/'+EX.n}
function submitExam(){
  if(!EX||EX.done)return;
  EX.done=true;EX.res={};let c=0;const by={};
  EX.keys.forEach(k=>{
    const q=QI[k],v=EX.ans[k];
    const ok=v!==undefined&&(q.k==='mc'?v===q.a:gradeText(q,v));
    EX.res[k]=ok;if(ok)c++;
    const b=by[q.sec]=by[q.sec]||[0,0];b[1]++;if(ok)b[0]++;
    ST.res[k]={ok,v};
  });
  EX.c=c;EX.score=Math.round(c/EX.n*100)/10;
  ST.exam=(ST.exam||[]);ST.exam.push({p:EX.paper||'',t:Date.now(),n:EX.n,c,s:EX.score,used:Math.round((Math.min(Date.now(),EX.end)-EX.start)/60000)});
  save();updateBadge();EX.by=by;
  if(location.hash.indexOf('#test')===0)route();
}
function viewTest(){
  if(!EX){
    const hist=(ST.exam||[]).slice(-6).reverse();
    return '<div class="sec"><div><h1>Đề thi thử</h1><p class="sub lead">Câu hỏi được rút ngẫu nhiên từ tất cả phần (phát âm, hình thức từ, 6 chuyên đề), mỗi lần một đề khác. Không hiện đáp án cho đến khi nộp bài.</p></div>'+
    '<div class="grid"><div class="card hl"><b>Đề số 2: Chuyên đề 1–5 (cố định)</b><p class="stat">40 câu mới, 8 câu mỗi chuyên đề (danh từ, mạo từ, đại từ, V-ing/to V, giới từ). 45 phút, mọi người làm cùng một đề.</p><button class="btn pri" data-start="p2">Bắt đầu Đề số 2</button></div><div class="card"><b>Đề ngắn: 20 câu</b><p class="stat">25 phút. Dùng khi còn ít thời gian.</p><button class="btn pri" data-start="20">Bắt đầu đề 20 câu</button></div><div class="card"><b>Đề đầy đủ: 40 câu</b><p class="stat">50 phút. Mô phỏng một bài thi hoàn chỉnh.</p><button class="btn pri" data-start="40">Bắt đầu đề 40 câu</button></div></div>'+
    (hist.length?'<h2>Các lần làm gần đây</h2><div class="card"><ul class="hist">'+hist.map(h=>'<li>'+new Date(h.t).toLocaleString('vi-VN')+(h.p==='p2'?' (Đề số 2)':'')+': <b>'+String(h.s).replace('.',',')+'/10</b> ('+h.c+'/'+h.n+' câu, '+h.used+' phút)</li>').join('')+'</ul></div>':'')+'</div>';
  }
  if(!EX.done){
    let h='<div class="sec"><div class="exam-bar"><div><span class="stat">Thời gian còn lại</span><div class="timer" id="tm">'+fmt(Math.max(0,EX.end-Date.now()))+'</div></div><span id="exCount" class="stat"></span><div class="row"><button class="btn sm" id="exCancel">Hủy đề</button><button class="btn pri" id="exSubmit">Nộp bài</button></div></div><div id="examBody" class="set"><div class="qs">';
    let last='',no=0;
    EX.keys.forEach(k=>{const q=QI[k];if(q.sec!==last){last=q.sec;h+='<div class="exam-sec">'+SECS[q.sec]+'</div>'}h+=qHTML(k,++no,{mode:'exam',v:EX.ans[k]})});
    return h+'</div></div></div>';
  }
  let h='<div class="sec"><div class="card hl"><div class="stat">Kết quả</div><div class="big">'+String(EX.score).replace('.',',')+' / 10</div><p>Đúng '+EX.c+'/'+EX.n+' câu. Các câu sai đã được thêm vào Sổ lỗi sai.</p></div>';
  h+='<div class="card tbl"><table><tr><th>Phần</th><th>Đúng</th><th>Tổng</th></tr>'+Object.keys(EX.by).map(s=>'<tr><td>'+SECS[s]+'</td><td>'+EX.by[s][0]+'</td><td>'+EX.by[s][1]+'</td></tr>').join('')+'</table></div>';
  h+='<div class="row"><button class="btn pri" data-start="'+(EX.paper||(EX.n>=40?40:20))+'">'+(EX.paper?'Làm lại đề này':'Làm đề mới')+'</button><button class="btn" id="exBack">Về màn hình chọn đề</button><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="#wrong">Luyện lại câu sai</a></div><h2>Xem lại bài</h2><div class="set"><div class="qs">';
  let no=0;EX.keys.forEach(k=>{no++;h+=qHTML(k,no,{mode:'review',st:{ok:EX.res[k],v:EX.ans[k]}})});
  return h+'</div></div></div>';
}

/* ----- Sổ lỗi sai ----- */
function viewWrong(){
  const keys=Object.keys(ST.res).filter(k=>ST.res[k].ok===false&&QI[k]);
  keys.sort((a,b)=>SEC_ORDER.indexOf(QI[a].sec)-SEC_ORDER.indexOf(QI[b].sec));
  let h='<div class="sec"><div><h1>Sổ lỗi sai</h1><p class="sub lead">Mọi câu bạn làm sai ở các phần đều được gom ở đây. Làm đúng lại thì câu đó biến mất khỏi sổ.</p></div>';
  if(!keys.length)return h+'<div class="card empty">Chưa có câu sai nào. Hãy làm bài ở các phần hoặc thi thử.</div></div>';
  h+='<div class="row"><b>'+keys.length+' câu cần luyện lại</b></div><div class="set"><div class="qs" id="wrongList">';
  let last='',no=0;
  keys.forEach(k=>{const q=QI[k];if(q.sec!==last){last=q.sec;h+='<div class="exam-sec">'+(CDNAME[q.sec]||SECS[q.sec])+'</div>'}h+=qHTML(k,++no,{fresh:true})});
  return h+'</div></div></div>';
}

/* ===================== Bộ định tuyến ===================== */
const TABS=[['home','Trang chủ'],['pa','Phát âm'],['wf','Hình thức từ'],['gr','Ngữ pháp'],['wr','Viết đoạn'],['sp','Luyện nói'],['test','Đề thi thử'],['wrong','Sổ lỗi sai']];
function route(){
  const hash=(location.hash||'#home').slice(1);
  const parts=hash.split('-'),tab=TABS.some(t=>t[0]===parts[0])?parts[0]:'home',sub=parts.slice(1).join('-');
  $('#tabs').innerHTML=TABS.map(t=>'<a class="tab" href="#'+(t[0]==='gr'?'gr-'+(CDNAME[sub]&&tab==='gr'?sub:'cd1'):t[0])+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+t[1]+(t[0]==='wrong'?'<span class="n" id="wrongN"></span>':'')+'</a>').join('');
  const V={home:viewHome,pa:viewPA,wf:viewWF,gr:()=>viewGR(sub),wr:viewWR,sp:()=>viewSP(sub),test:viewTest,wrong:viewWrong};
  if(window.speechSynthesis)speechSynthesis.cancel();if(typeof SPREC!=='undefined'&&SPREC)spRecAbort();clearInterval(SPT);
  $('#app').innerHTML=V[tab]();
  if(tab==='sp')spVoiceInfo();
  if(tab==='wr')initWR();
  if(tab==='test'&&EX&&!EX.done)examCount();
  updateBadge();
  const cur=$('.tab[aria-current="page"]');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
  if(!route.first){route.first=true}else window.scrollTo(0,0);
  document.title='Ôn thi HSG Tiếng Anh 8';
}
window.addEventListener('hashchange',route);

/* các nút phụ */
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if((b=t.closest('[data-start]'))){startExam(b.dataset.start);route();window.scrollTo(0,0);return}
  if(t.closest('#exSubmit')){submitExam();window.scrollTo(0,0);return}
  if(t.closest('#exCancel')){EX=null;clearInterval(TM);route();return}
  if(t.closest('#exBack')){EX=null;route();return}
  if(t.closest('#resetAll')){
    const bt=$('#resetAll');
    if(bt.dataset.sure){ST.res={};ST.exam=[];save();route()}else{bt.dataset.sure='1';bt.textContent='Bấm lần nữa để xác nhận xóa';}
    return;
  }
  if((b=t.closest('#uchips .chip'))){UF.u=+b.dataset.u;$$('#uchips .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#utable').innerHTML=unitTable();return}
  if(t.closest('#utest')){UF.test=!UF.test;$('#utest').setAttribute('aria-pressed',UF.test);$('#utable').innerHTML=unitTable();return}
  if(t.closest('#ushow')){$$('#utable .cov').forEach(x=>x.classList.add('show'));return}
  if((b=t.closest('.cov'))){b.classList.toggle('show');return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cov')){e.preventDefault();e.target.classList.toggle('show')}});
document.addEventListener('input',e=>{if(e.target.id==='usearch'){UF.q=e.target.value;$('#utable').innerHTML=unitTable()}});
route();


</script>
